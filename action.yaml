name: 'Build Process Watcher'
description: 'Monitor Java build processes with optional backend integration'
author: 'cdsap'

inputs:
  remote_monitoring:
    description: 'Enable remote monitoring with cloud dashboard (set BACKEND_URL and FRONTEND_URL env vars for custom URLs)'
    required: false
    default: 'false'
  run_id:
    description: 'Unique run identifier'
    required: false
  log_file:
    description: 'Log file name for local monitoring'
    required: false
    default: 'build_process_watcher.log'
  interval:
    description: 'Monitoring interval in seconds'
    required: false
    default: '5'
  debug:
    description: 'Enable debug mode for detailed logging'
    required: false
    default: 'false'
  disable_summary_output:
    description: 'Disable GitHub Actions summary output when remote monitoring is enabled (only applies when remote_monitoring is true)'
    required: false
    default: 'false'
  export_to_bigquery:
    description: "Optional metrics export: when true and remote_monitoring is true, ask the backend to export this run's samples to BigQuery when the run finishes (requires BIGQUERY_EXPORT_DATASET on the backend service)"
    required: false
    default: 'false'

outputs:
  run_id:
    description: 'The unique run identifier for this monitoring session'
  backend_url:
    description: 'The backend URL used for data ingestion (empty if remote monitoring disabled)'
  remote_monitoring:
    description: 'Whether remote monitoring was enabled'
  frontend_url:
    description: 'The frontend dashboard URL for viewing results (only available when remote monitoring is enabled)'
  export_to_bigquery:
    description: 'Whether optional BigQuery metrics export was requested for this run (backend must be configured with BIGQUERY_EXPORT_DATASET)'

branding:
  icon: "activity"
  color: "gray-dark"

runs:
  using: 'node20'
  main: 'dist/index_with_backend.js'
  post: 'dist/cleanup.js'
