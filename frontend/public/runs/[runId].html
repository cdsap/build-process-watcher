<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Process Watcher - Run Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/config.js"></script>
    <script>
        // Set all links dynamically based on config
        (function() {
            const frontendUrl = window.BUILD_PROCESS_WATCHER_CONFIG?.frontendUrl || 'https://process-watcher.web.app';
            document.addEventListener('DOMContentLoaded', function() {
                // Set all "back home" links
                document.querySelectorAll('.back-home-link, a[href="https://process-watcher.web.app"]').forEach(link => {
                    link.href = frontendUrl;
                });
            });
            // Also set immediately for elements that might exist before DOMContentLoaded
            const setLinks = function() {
                document.querySelectorAll('a[href="https://process-watcher.web.app"]').forEach(link => {
                    link.href = frontendUrl;
                });
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setLinks);
            } else {
                setLinks();
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #111827;
        }

        .run-info {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .status-card h3 {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .status-card p {
            font-size: 1.125rem;
            font-weight: 600;
            color: #111827;
        }

        .process-info-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .process-info-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 1.5rem;
        }

        .process-info-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .process-info-card h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .process-info-card .process-meta {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .vm-flags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .vm-flag {
            background: #e5e7eb;
            color: #374151;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        .status-in-progress {
            color: #2563eb;
        }

        .status-completed {
            color: #059669;
        }

        .chart-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        .downloads-toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0 0 1rem 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.8rem;
            background: #2563eb;
            color: #fff;
            border: 1px solid #1d4ed8;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            text-decoration: none;
            cursor: pointer;
        }

        .btn.secondary {
            background: #6b7280;
            border-color: #4b5563;
        }

        .chart-wrapper {
            min-width: 600px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: #dc2626;
            text-align: center;
        }

        .not-found {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: #a16207;
            text-align: center;
        }

        .refresh-controls {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .refresh-controls label {
            font-weight: 500;
            color: #0369a1;
        }

        .refresh-controls select {
            padding: 0.5rem;
            border: 1px solid #7dd3fc;
            border-radius: 0.375rem;
            background: white;
            color: #0c4a6e;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .refresh-controls .status-text {
            color: #0369a1;
            font-size: 0.875rem;
        }

        .refresh-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            color: #0369a1;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .replay-controls {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .replay-controls .buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .replay-controls .meta {
            font-size: 0.875rem;
            color: #0369a1;
        }

        .replay-controls .timeline {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .replay-controls input[type="range"] {
            width: 100%;
        }

        @media (max-width: 768px) {
            .status-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .chart-container {
                padding: 1rem;
                margin: 0 -10px 2rem -10px;
                border-radius: 0;
            }
            
            .chart-wrapper {
                min-width: 500px;
            }

            .replay-controls {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .run-info h2 {
                font-size: 1.25rem;
            }
        }
        
        @media (max-width: 480px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-wrapper {
                min-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Build Process Watcher</h1>
        </header>

        <div id="content">
            <div class="loading">
                <p>Loading run data...</p>
            </div>
        </div>
    </div>

    <script>
        // Get run ID from URL
        const pathParts = window.location.pathname.split('/');
        const runId = pathParts[pathParts.length - 1];
        
        // Refresh interval management
        let refreshInterval = parseInt(localStorage.getItem('refreshInterval')) || 60; // Default 60 seconds
        let refreshTimer = null;
        let lastRefreshTime = null;
        
        if (!runId || runId === 'runs' || runId === '') {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>Invalid Run ID</h2>
                    <p>No run ID provided in the URL.</p>
                    <a href="#" class="back-home-link" style="color: #2563eb;">Back to Home</a>
                </div>
            `;
        } else {
            loadRunData(runId);
        }

        function setRefreshInterval(seconds) {
            refreshInterval = seconds;
            localStorage.setItem('refreshInterval', seconds);
            
            // Cancel existing timer and restart with new interval
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
            
            // Reload immediately to show the new interval in UI
            loadRunData(runId);
        }

        function cancelRefresh() {
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
        }

        async function loadRunData(runId) {
            const backendUrl = window.BUILD_PROCESS_WATCHER_CONFIG?.backendUrl || 'https://build-process-watcher-backend-685615422311.us-central1.run.app';
            
            try {
                const response = await fetch(`${backendUrl}/runs/${runId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showNotFound(runId);
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return;
                }

                const data = await response.json();
                lastRefreshTime = new Date();
                renderDashboard(runId, data);
                window.currentRunData = data;
                
                // Auto-refresh if not finished
                cancelRefresh(); // Cancel any existing timer
                if (!data.finished) {
                    refreshTimer = setTimeout(() => loadRunData(runId), refreshInterval * 1000);
                }
                
            } catch (error) {
                console.error('Error loading run data:', error);
                showError(error.message);
            }
        }

        function renderDashboard(runId, data) {
            const isFinished = data.finished === true;
            const samples = data.samples || [];
            const processInfo = data.process_info || {};
            window.currentSamples = samples;
            
            const refreshStatus = isFinished ? 'Stopped' : `Active (${refreshInterval}s)`;
            const lastRefreshText = lastRefreshTime ? lastRefreshTime.toLocaleTimeString() : 'Never';
            
            // Calculate metrics for each process and overall
            let maxRssAllProcesses = 0;
            const processMetrics = {};
            
            // Calculate metrics per process
            for (const [pid, info] of Object.entries(processInfo)) {
                const processSamples = samples.filter(s => s.PID === pid);
                let maxRss = 0;
                let maxHeap = 0;
                let totalGCTime = 0;
                
                processSamples.forEach(sample => {
                    if (sample.RSS && sample.RSS > maxRss) {
                        maxRss = sample.RSS;
                    }
                    if (sample.HeapUsed && sample.HeapUsed > maxHeap) {
                        maxHeap = sample.HeapUsed;
                    }
                    if (sample.GCTime) {
                        // GCTime is stored in milliseconds, convert to seconds for display
                        totalGCTime += sample.GCTime / 1000;
                    }
                });
                
                processMetrics[pid] = {
                    maxRss: maxRss,
                    maxHeap: maxHeap,
                    totalGCTime: totalGCTime
                };
                
            }

            // Calculate overall max RSS by summing per-timestamp totals
            // Use forward-filling to avoid drops when a process skips a sample
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            const lastKnownRSS = {};
            processKeys.forEach(processKey => {
                lastKnownRSS[processKey] = 0;
            });

            timestamps.forEach(timestamp => {
                let total = 0;
                let hasAnyProcess = false;

                processKeys.forEach(processKey => {
                    const [processName, pid] = processKey.split('|');
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];

                    if (sample) {
                        lastKnownRSS[processKey] = sample.RSS;
                        total += sample.RSS;
                        hasAnyProcess = true;
                    } else if (lastKnownRSS[processKey] > 0) {
                        total += lastKnownRSS[processKey];
                        hasAnyProcess = true;
                    }
                });

                if (hasAnyProcess && total > maxRssAllProcesses) {
                    maxRssAllProcesses = total;
                }
            });
            
            // Render process info section
            let processInfoHtml = '';
            if (Object.keys(processInfo).length > 0) {
                processInfoHtml = '<div class="process-info-section">';
                processInfoHtml += '<h2>Process Information</h2>';
                for (const [pid, info] of Object.entries(processInfo)) {
                    const vmFlags = info.vm_flags || [];
                    const metrics = processMetrics[pid] || { maxRss: 0, maxHeap: 0, totalGCTime: 0 };
                    processInfoHtml += '<div class="process-info-card">';
                    processInfoHtml += `<h3>${info.name || 'Unknown'}</h3>`;
                    processInfoHtml += `<div class="process-meta">PID: ${pid}</div>`;
                    
                    // Add metrics
                    processInfoHtml += '<div style="margin: 1rem 0; padding: 0.75rem; background: #f0f9ff; border-radius: 0.5rem; border-left: 3px solid #2563eb;">';
                    processInfoHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 0.5rem;">';
                    processInfoHtml += `<div><strong>Max RSS:</strong> ${metrics.maxRss > 0 ? metrics.maxRss.toFixed(1) + ' MB' : 'N/A'}</div>`;
                    processInfoHtml += `<div><strong>Max Heap:</strong> ${metrics.maxHeap > 0 ? metrics.maxHeap.toFixed(1) + ' MB' : 'N/A'}</div>`;
                    processInfoHtml += `<div><strong>Total GC Time:</strong> ${metrics.totalGCTime > 0 ? metrics.totalGCTime.toFixed(3) + ' s' : 'N/A'}</div>`;
                    processInfoHtml += '</div>';
                    processInfoHtml += '</div>';
                    
                    if (vmFlags.length > 0) {
                        processInfoHtml += '<div><strong>VM Flags:</strong></div>';
                        processInfoHtml += '<div class="vm-flags-list">';
                        vmFlags.forEach(flag => {
                            processInfoHtml += `<span class="vm-flag">${escapeHtml(flag)}</span>`;
                        });
                        processInfoHtml += '</div>';
                    } else {
                        processInfoHtml += '<div class="process-meta">No VM flags available</div>';
                    }
                    processInfoHtml += '</div>';
                }
                
                // Add summary section for max RSS across all processes
                if (maxRssAllProcesses > 0) {
                    processInfoHtml += '<div class="process-info-card" style="background: #fef3c7; border-left: 3px solid #f59e0b;">';
                    processInfoHtml += '<h3>Overall Summary</h3>';
                    processInfoHtml += `<div style="font-size: 1.125rem; font-weight: 600; color: #92400e;">Max RSS (All Processes): ${maxRssAllProcesses.toFixed(1)} MB</div>`;
                    processInfoHtml += '</div>';
                }
                
                processInfoHtml += '</div>';
            }
            
            document.getElementById('content').innerHTML = `
                <div class="run-info">
                    <h2>Run Details</h2>
                    <p><strong>Run ID:</strong> <code>${runId}</code></p>
                    ${data.finished_at ? `<p><strong>Finished:</strong> ${new Date(data.finished_at).toLocaleString()}</p>` : ''}
                    ${data.updated_at ? `<p><strong>Last Updated:</strong> ${new Date(data.updated_at).toLocaleString()}</p>` : ''}
                </div>

                ${!isFinished ? `
                    <div class="refresh-controls">
                        <label for="refreshInterval">🔄 Auto-refresh interval:</label>
                        <select id="refreshInterval" onchange="setRefreshInterval(parseInt(this.value))">
                            <option value="5" ${refreshInterval === 5 ? 'selected' : ''}>5 seconds</option>
                            <option value="10" ${refreshInterval === 10 ? 'selected' : ''}>10 seconds</option>
                            <option value="30" ${refreshInterval === 30 ? 'selected' : ''}>30 seconds</option>
                            <option value="60" ${refreshInterval === 60 ? 'selected' : ''}>1 minute</option>
                            <option value="120" ${refreshInterval === 120 ? 'selected' : ''}>2 minutes</option>
                            <option value="300" ${refreshInterval === 300 ? 'selected' : ''}>5 minutes</option>
                        </select>
                        <span class="status-text">Last refresh: ${lastRefreshText}</span>
                    </div>
                ` : ''}

                <div class="status-grid">
                    <div class="status-card">
                        <h3>Status</h3>
                        <p class="${isFinished ? 'status-completed' : 'status-in-progress'}">
                            ${isFinished ? 'Completed' : 'In Progress'}
                        </p>
                    </div>
                    <div class="status-card">
                        <h3>Samples</h3>
                        <p>${samples.length}</p>
                    </div>
                    <div class="status-card">
                        <h3>Processes</h3>
                        <p>${new Set(samples.map(s => `${s.Name}|${s.PID}`)).size}</p>
                    </div>
                    <div class="status-card">
                        <h3>Auto-refresh</h3>
                        <p>${refreshStatus}</p>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-png">Download PNG</button>
                        <button class="btn" id="btn-download-svg">Download SVG</button>
                        <button class="btn secondary" id="btn-download-json">Download JSON</button>
                        <button class="btn secondary" id="btn-download-csv">Download CSV</button>
                    </div>
                    ${isFinished === true && samples.length ? `
                        <div class="replay-controls" id="rss-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-rss-replay-play">Play</button>
                                <button class="btn secondary" id="btn-rss-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-rss-replay-reset">Reset</button>
                            </div>
                            <div class="meta" id="rss-replay-meta">Frame 0 / 0</div>
                            <div class="timeline">
                                <input type="range" id="rss-replay-timeline" min="0" max="0" value="0">
                                <div class="meta" id="rss-replay-time-label">Elapsed: 0s</div>
                                <div class="meta">
                                    Speed:
                                    <select id="rss-replay-speed">
                                        <option value="5">5x</option>
                                        <option value="10">10x</option>
                                        <option value="15" selected>15x</option>
                                        <option value="20">20x</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    <h3>Memory Usage Over Time</h3>
                    <div class="chart-wrapper">
                        <div id="chart" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>

                ${hasGCData(samples) ? `
                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-gc-png">Download GC PNG</button>
                        <button class="btn" id="btn-download-gc-svg">Download GC SVG</button>
                    </div>
                    ${isFinished === true ? `
                        <div class="replay-controls" id="gc-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-gc-replay-play">Play</button>
                                <button class="btn secondary" id="btn-gc-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-gc-replay-reset">Reset</button>
                            </div>
                            <div class="meta" id="gc-replay-meta">Frame 0 / 0</div>
                            <div class="timeline">
                                <input type="range" id="gc-replay-timeline" min="0" max="0" value="0">
                                <div class="meta" id="gc-replay-time-label">Elapsed: 0s</div>
                                <div class="meta">
                                    Speed:
                                    <select id="gc-replay-speed">
                                        <option value="5">5x</option>
                                        <option value="10">10x</option>
                                        <option value="15" selected>15x</option>
                                        <option value="20">20x</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    <h3>Garbage Collection Time Over Time</h3>
                    <div class="chart-wrapper">
                        <div id="gc-chart" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
                ` : ''}
                ${shouldShowRssHeapRatioChart(samples) ? `
                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-rss-heap-png">Download Heap/RSS PNG</button>
                        <button class="btn" id="btn-download-rss-heap-svg">Download Heap/RSS SVG</button>
                    </div>
                    ${isFinished === true ? `
                        <div class="replay-controls" id="ratio-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-ratio-replay-play">Play</button>
                                <button class="btn secondary" id="btn-ratio-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-ratio-replay-reset">Reset</button>
                            </div>
                            <div class="meta" id="ratio-replay-meta">Frame 0 / 0</div>
                            <div class="timeline">
                                <input type="range" id="ratio-replay-timeline" min="0" max="0" value="0">
                                <div class="meta" id="ratio-replay-time-label">Elapsed: 0s</div>
                                <div class="meta">
                                    Speed:
                                    <select id="ratio-replay-speed">
                                        <option value="5">5x</option>
                                        <option value="10">10x</option>
                                        <option value="15" selected>15x</option>
                                        <option value="20">20x</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    <h3>Heap/RSS Ratio Over Time</h3>
                    <div class="chart-wrapper">
                        <div id="rss-heap-chart" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
                ` : ''}

                ${processInfoHtml}
            `;

            if (samples.length > 0) {
                renderChart(samples);
                if (hasGCData(samples)) {
                    renderGCChart(samples);
                }
                if (shouldShowRssHeapRatioChart(samples)) {
                    renderRssHeapRatioChart(samples);
                }
                if (isFinished === true) {
                    initReplay(samples);
                }
            }

            // Wire download buttons
            const btnPng = document.getElementById('btn-download-png');
            const btnSvg = document.getElementById('btn-download-svg');
            const btnJson = document.getElementById('btn-download-json');
            const btnCsv = document.getElementById('btn-download-csv');
            const btnGcPng = document.getElementById('btn-download-gc-png');
            const btnGcSvg = document.getElementById('btn-download-gc-svg');
            const btnRssHeapPng = document.getElementById('btn-download-rss-heap-png');
            const btnRssHeapSvg = document.getElementById('btn-download-rss-heap-svg');

            if (btnPng) btnPng.onclick = () => downloadChart('png');
            if (btnSvg) btnSvg.onclick = () => downloadChart('svg');
            if (btnJson) btnJson.onclick = () => downloadJson(runId);
            if (btnCsv) btnCsv.onclick = () => downloadCsv(runId);
            if (btnGcPng) btnGcPng.onclick = () => downloadGCChart('png');
            if (btnGcSvg) btnGcSvg.onclick = () => downloadGCChart('svg');
            if (btnRssHeapPng) btnRssHeapPng.onclick = () => downloadRssHeapRatioChart('png');
            if (btnRssHeapSvg) btnRssHeapSvg.onclick = () => downloadRssHeapRatioChart('svg');
        }

        function hasGCData(samples) {
            return samples.some(sample => sample.GCTime !== undefined && sample.GCTime !== null && sample.GCTime > 0);
        }

        function shouldShowRssHeapRatioChart(samples) {
            const uniqueTimestamps = new Set(samples.map(s => s.Timestamp));
            return uniqueTimestamps.size > 10;
        }

        function renderGCChart(samples) {

        function initReplay(samples) {
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            const elapsedByTimestamp = new Map();
            samples.forEach(sample => {
                if (!elapsedByTimestamp.has(sample.Timestamp)) {
                    elapsedByTimestamp.set(sample.Timestamp, sample.ElapsedTime);
                }
            });

            const colors = ['#3498db', '#e74c3c', '#9b59b6', '#2ecc71', '#f39c12', '#e67e22', '#1abc9c', '#e91e63'];
            const series = {};

            processKeys.forEach((processKey, index) => {
                const [processName, pid] = processKey.split('|');
                const rss = timestamps.map(timestamp => {
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    return sample ? sample.RSS : null;
                });
                const heap = timestamps.map(timestamp => {
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    return sample ? sample.HeapUsed : null;
                });
                const gc = timestamps.map(timestamp => {
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    if (!sample) return null;
                    return sample.GCTime && sample.GCTime > 0 ? sample.GCTime / 1000 : null;
                });
                const ratio = timestamps.map(timestamp => {
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    if (!sample || !sample.RSS) return null;
                    return sample.HeapUsed / sample.RSS;
                });

                series[processKey] = {
                    processName,
                    pid,
                    color: colors[index % colors.length],
                    rss,
                    heap,
                    gc,
                    ratio,
                    firstRss: rss.findIndex(value => value !== null),
                    firstGc: gc.findIndex(value => value !== null),
                    firstRatio: ratio.findIndex(value => value !== null)
                };
            });

            const lastKnownRss = {};
            const lastKnownHeap = {};
            processKeys.forEach(key => {
                lastKnownRss[key] = 0;
                lastKnownHeap[key] = 0;
            });

            const totalRss = [];
            const totalHeap = [];
            timestamps.forEach(timestamp => {
                let totalRssValue = 0;
                let totalHeapValue = 0;
                let hasAny = false;
                processKeys.forEach(processKey => {
                    const [processName, pid] = processKey.split('|');
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    if (sample) {
                        if (sample.RSS && sample.RSS > 0) {
                            lastKnownRss[processKey] = sample.RSS;
                        }
                        if (sample.HeapUsed && sample.HeapUsed > 0) {
                            lastKnownHeap[processKey] = sample.HeapUsed;
                        }
                    }
                    if (lastKnownRss[processKey] > 0) {
                        totalRssValue += lastKnownRss[processKey];
                        totalHeapValue += lastKnownHeap[processKey];
                        hasAny = true;
                    }
                });
                totalRss.push(hasAny ? totalRssValue : null);
                totalHeap.push(hasAny ? totalHeapValue : null);
            });

            const totalRatio = totalRss.map((rssValue, index) => {
                const heapValue = totalHeap[index];
                if (!rssValue || rssValue === 0 || heapValue === null) return null;
                return heapValue / rssValue;
            });

            const totalGc = timestamps.map(timestamp => {
                let total = 0;
                let hasAny = false;
                processKeys.forEach(processKey => {
                    const [processName, pid] = processKey.split('|');
                    const sample = samples.find(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp);
                    if (sample && sample.GCTime !== undefined && sample.GCTime !== null && sample.GCTime > 0) {
                        total += sample.GCTime / 1000;
                        hasAny = true;
                    }
                });
                return hasAny ? total : null;
            });

            const firstTotalRssIndex = totalRss.findIndex(value => value !== null);
            const firstTotalRatioIndex = totalRatio.findIndex(value => value !== null);
            const firstTotalGcIndex = totalGc.findIndex(value => value !== null);

            function buildMemoryTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstRss === -1 || frameIndex < def.firstRss) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.rss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (RSS)`,
                        line: { color: def.color, width: 3 },
                        connectgaps: false
                    });
                    traces.push({
                        x: frameTimestamps,
                        y: def.heap.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (Heap)`,
                        line: { color: def.color, width: 2, dash: 'dash' },
                        connectgaps: false
                    });
                });
                if (firstTotalRssIndex !== -1 && frameIndex >= firstTotalRssIndex) {
                    traces.push({
                        x: frameTimestamps,
                        y: totalRss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: 'Total RSS Memory',
                        line: { color: '#2c3e50', width: 4 },
                        connectgaps: false
                    });
                }
                return traces;
            }

            function buildGCTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstGc === -1 || frameIndex < def.firstGc) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.gc.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: `${def.processName} PID:${def.pid}`,
                        line: { color: def.color, width: 3 },
                        marker: { size: 6, color: def.color },
                        connectgaps: false
                    });
                });
                if (firstTotalGcIndex !== -1 && frameIndex >= firstTotalGcIndex) {
                    traces.push({
                        x: frameTimestamps,
                        y: totalGc.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: 'Total GC Time',
                        line: { color: '#2c3e50', width: 4 },
                        connectgaps: false
                    });
                }
                return traces;
            }

            function buildRatioTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstRatio === -1 || frameIndex < def.firstRatio) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.ratio.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: `${def.processName} PID:${def.pid}`,
                        line: { color: def.color, width: 3 },
                        marker: { size: 6, color: def.color },
                        connectgaps: false
                    });
                });
                if (firstTotalRatioIndex !== -1 && frameIndex >= firstTotalRatioIndex) {
                    traces.push({
                        x: frameTimestamps,
                        y: totalRatio.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: 'Total Heap/RSS Ratio',
                        line: { color: '#2c3e50', width: 4 },
                        connectgaps: false
                    });
                }
                return traces;

            function setupReplayPanel(options) {
                const { panelKey, chartId, controlsId, buildTraces, layoutGetter, configGetter } = options;
                const controls = document.getElementById(controlsId);
                const chart = document.getElementById(chartId);
                if (!controls || !chart) return;

                if (!window.replayStops) {
                    window.replayStops = {};
                }
                if (window.replayStops[panelKey]) {
                    window.replayStops[panelKey]();
                }

                const timeline = document.getElementById(`${panelKey}-replay-timeline`);
                const meta = document.getElementById(`${panelKey}-replay-meta`);
                const timeLabel = document.getElementById(`${panelKey}-replay-time-label`);
                const playBtn = document.getElementById(`btn-${panelKey}-replay-play`);
                const pauseBtn = document.getElementById(`btn-${panelKey}-replay-pause`);
                const resetBtn = document.getElementById(`btn-${panelKey}-replay-reset`);
                const speedSelect = document.getElementById(`${panelKey}-replay-speed`);

                let isPlaying = false;
                let playTimer = null;
                let currentFrame = 0;
                let speedMultiplier = Number(speedSelect.value) || 15;

                timeline.max = String(Math.max(0, timestamps.length - 1));

                function updateUi(frameIndex) {
                    timeline.value = String(frameIndex);
                    meta.textContent = `Frame ${frameIndex + 1} / ${timestamps.length}`;
                    const timestamp = timestamps[frameIndex];
                    const elapsed = elapsedByTimestamp.get(timestamp);
                    const timeText = new Date(timestamp).toLocaleTimeString();
                    timeLabel.textContent = `Elapsed: ${elapsed}s | ${timeText}`;
                }

                function renderFrame(frameIndex) {
                    currentFrame = frameIndex;
                    updateUi(frameIndex);
                    return Plotly.react(chartId, buildTraces(frameIndex), layoutGetter(), configGetter());
                }

                function scheduleNext() {
                    if (!isPlaying) return;
                    if (currentFrame >= timestamps.length - 1) {
                        isPlaying = false;
                        return;
                    }
                    const nextDelay = Math.max(
                        16,
                        (timestamps[currentFrame + 1] - timestamps[currentFrame]) / speedMultiplier
                    );
                    playTimer = setTimeout(() => {
                        renderFrame(currentFrame + 1).then(scheduleNext);
                    }, nextDelay);
                }

                function play() {
                    if (isPlaying) return;
                    isPlaying = true;
                    scheduleNext();
                }

                function pause() {
                    isPlaying = false;
                    if (playTimer) {
                        clearTimeout(playTimer);
                        playTimer = null;
                    }
                }

                window.replayStops[panelKey] = pause;

                playBtn.addEventListener('click', play);
                pauseBtn.addEventListener('click', pause);
                resetBtn.addEventListener('click', () => {
                    pause();
                    renderFrame(0);
                });
                timeline.addEventListener('input', () => {
                    pause();
                    renderFrame(Number(timeline.value));
                });
                speedSelect.addEventListener('change', () => {
                    const parsed = Number(speedSelect.value);
                    if (!Number.isNaN(parsed) && parsed > 0) {
                        speedMultiplier = parsed;
                    }
                });

                renderFrame(0);
            }

            setupReplayPanel({
                panelKey: 'rss',
                chartId: 'chart',
                controlsId: 'rss-replay-controls',
                buildTraces: buildMemoryTraces,
                layoutGetter: getMemoryLayout,
                configGetter: getMemoryConfig

                configGetter: getRatioConfig
            });

                    if (sample) {
                        // Process reported at this timestamp - use actual value and update last known
                        lastKnownRSS[processKey] = sample.RSS;
                        total += sample.RSS;
                        hasAnyProcess = true;
                    } else if (lastKnownRSS[processKey] > 0) {
                        // Process didn't report at this timestamp, but we've seen it before
                        // Use forward-filled value (last known RSS) to avoid total dropping
                        total += lastKnownRSS[processKey];
                        hasAnyProcess = true;
                    }
                    // If lastKnownRSS[processKey] is 0, process hasn't started yet - don't include it
                });
                
                return hasAnyProcess ? total : null;  // null if no processes exist yet
            });
            
            traces.push({
                x: timestamps.map(t => new Date(t)),
                y: totalData,
                type: 'scatter',
                mode: 'lines',
                name: 'Total RSS Memory',
                line: { color: '#2c3e50', width: 4 },
                connectgaps: false  // Don't connect across null values
            });

            // Detect if mobile
            const isMobile = window.innerWidth < 768;
            
            const layout = getMemoryLayout();
            const config = getMemoryConfig();

            Plotly.newPlot('chart', traces, layout, config);
            
            // Handle window resize
            window.addEventListener('resize', function() {
                Plotly.Plots.resize('chart');
            });
        }

        function downloadCsv(runId) {
            try {
                const samples = window.currentSamples || [];
                if (!samples.length) return;
                const hasGC = hasGCData(samples);
                const header = hasGC ? 
                    ['timestamp','elapsed_time','pid','name','rss_mb','heap_used_mb','heap_capacity_mb','gc_time_s'] :
                    ['timestamp','elapsed_time','pid','name','rss_mb','heap_used_mb','heap_capacity_mb'];
                const rows = samples.map(s => {
                    const baseRow = [
                        s.Timestamp,
                        s.ElapsedTime,
                        s.PID,
                        s.Name,
                        s.RSS,
                        s.HeapUsed,
                        s.HeapCap
                    ];
                    if (hasGC) {
                        // Convert from milliseconds (stored in DB) to seconds (for display)
                        baseRow.push(s.GCTime ? (s.GCTime / 1000).toFixed(3) : 0);
                    }
                    return baseRow;
                });
                const csv = [header.join(','), ...rows.map(r => r.map(escapeCsv).join(','))].join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `build-monitor-${runId}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Failed to download CSV:', e);
            }
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeCsv(value) {
            if (value === undefined || value === null) return '';
            const str = String(value);
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }
