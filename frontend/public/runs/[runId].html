<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Process Watcher - Run Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/config.js"></script>
    <script>
        // Set all links dynamically based on config
        (function() {
            const frontendUrl = window.BUILD_PROCESS_WATCHER_CONFIG?.frontendUrl || 'https://process-watcher.web.app';
            document.addEventListener('DOMContentLoaded', function() {
                // Set all "back home" links
                document.querySelectorAll('.back-home-link, a[href="https://process-watcher.web.app"]').forEach(link => {
                    link.href = frontendUrl;
                });
            });
            // Also set immediately for elements that might exist before DOMContentLoaded
            const setLinks = function() {
                document.querySelectorAll('a[href="https://process-watcher.web.app"]').forEach(link => {
                    link.href = frontendUrl;
                });
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setLinks);
            } else {
                setLinks();
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #111827;
        }

        .run-info {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .status-card h3 {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .status-card p {
            font-size: 1.125rem;
            font-weight: 600;
            color: #111827;
        }

        .process-info-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .process-info-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 1.5rem;
        }

        .process-info-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .process-info-card h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .process-info-card .process-meta {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .vm-flags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .vm-flag {
            background: #e5e7eb;
            color: #374151;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        .status-in-progress {
            color: #2563eb;
        }

        .status-completed {
            color: #059669;
        }

        .chart-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        .downloads-toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0 0 1rem 0;
        }

        .chart-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin: 0 0 1rem 0;
            font-size: 0.875rem;
            color: #475569;
        }

        .chart-filters label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.8rem;
            background: #2563eb;
            color: #fff;
            border: 1px solid #1d4ed8;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            text-decoration: none;
            cursor: pointer;
        }

        .btn.secondary {
            background: #6b7280;
            border-color: #4b5563;
        }

        .chart-wrapper {
            min-width: 600px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: #dc2626;
            text-align: center;
        }

        .not-found {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: #a16207;
            text-align: center;
        }

        .refresh-controls {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .refresh-controls label {
            font-weight: 500;
            color: #0369a1;
        }

        .refresh-controls select {
            padding: 0.5rem;
            border: 1px solid #7dd3fc;
            border-radius: 0.375rem;
            background: white;
            color: #0c4a6e;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .refresh-controls .status-text {
            color: #0369a1;
            font-size: 0.875rem;
        }

        .refresh-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            color: #0369a1;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .compare-controls {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .compare-controls .meta {
            font-size: 0.875rem;
            color: #334155;
        }

        .compare-controls input[type="file"] {
            font-size: 0.875rem;
        }

        .compare-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 2rem;
        }

        .compare-column h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }

        .replay-controls {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .replay-controls .buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .replay-controls .meta {
            font-size: 0.875rem;
            color: #0369a1;
        }

        .replay-controls .timeline {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .replay-controls input[type="range"] {
            width: 100%;
        }

        @media (max-width: 768px) {
            .status-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .chart-container {
                padding: 1rem;
                margin: 0 -10px 2rem -10px;
                border-radius: 0;
            }
            
            .chart-wrapper {
                min-width: 500px;
            }

            .replay-controls {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .run-info h2 {
                font-size: 1.25rem;
            }
        }
        
        @media (max-width: 480px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-wrapper {
                min-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Build Process Watcher</h1>
        </header>

        <div id="content">
            <div class="loading">
                <p>Loading run data...</p>
            </div>
        </div>
    </div>

    <script>
        // Get run ID from URL
        const pathParts = window.location.pathname.split('/');
        const runId = pathParts[pathParts.length - 1];
        
        // Refresh interval management
        let refreshInterval = parseInt(localStorage.getItem('refreshInterval')) || 60; // Default 60 seconds
        let refreshTimer = null;
        let lastRefreshTime = null;
        
        if (!runId || runId === 'runs' || runId === '') {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>Invalid Run ID</h2>
                    <p>No run ID provided in the URL.</p>
                    <a href="#" class="back-home-link" style="color: #2563eb;">Back to Home</a>
                </div>
            `;
        } else {
            loadRunData(runId);
        }

        function setRefreshInterval(seconds) {
            refreshInterval = seconds;
            localStorage.setItem('refreshInterval', seconds);
            
            // Cancel existing timer and restart with new interval
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
            
            // Reload immediately to show the new interval in UI
            loadRunData(runId);
        }

        function cancelRefresh() {
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
        }

        async function loadRunData(runId) {
            const backendUrl = window.BUILD_PROCESS_WATCHER_CONFIG?.backendUrl || 'https://build-process-watcher-backend-685615422311.us-central1.run.app';
            
            try {
                const response = await fetch(`${backendUrl}/runs/${runId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showNotFound(runId);
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return;
                }

                const data = await response.json();
                lastRefreshTime = new Date();
                renderDashboard(runId, data);
                window.currentRunData = data;
                
                // Auto-refresh if not finished
                cancelRefresh(); // Cancel any existing timer
                if (!data.finished) {
                    refreshTimer = setTimeout(() => loadRunData(runId), refreshInterval * 1000);
                }
                
            } catch (error) {
                console.error('Error loading run data:', error);
                showError(error.message);
            }
        }

        function renderDashboard(runId, data) {
            const isFinished = data.finished === true;
            const samples = data.samples || [];
            const processInfo = data.process_info || {};
            window.currentSamples = samples;
            
            const refreshStatus = isFinished ? 'Stopped' : `Active (${refreshInterval}s)`;
            const lastRefreshText = lastRefreshTime ? lastRefreshTime.toLocaleTimeString() : 'Never';
            
            // Calculate metrics for each process and overall
            let maxRssAllProcesses = 0;
            const processMetrics = {};
            
            // Calculate metrics per process
            for (const [pid, info] of Object.entries(processInfo)) {
                const processSamples = samples.filter(s => s.PID === pid);
                let maxRss = 0;
                let maxHeap = 0;
                let maxGCTimeSeconds = 0;
                
                processSamples.forEach(sample => {
                    if (sample.RSS && sample.RSS > maxRss) {
                        maxRss = sample.RSS;
                    }
                    if (sample.HeapUsed && sample.HeapUsed > maxHeap) {
                        maxHeap = sample.HeapUsed;
                    }
                    if (sample.GCTime) {
                        // GCTime is cumulative in samples; keep the max in seconds.
                        const gcSeconds = sample.GCTime / 1000;
                        if (gcSeconds > maxGCTimeSeconds) {
                            maxGCTimeSeconds = gcSeconds;
                        }
                    }
                });
                
                processMetrics[pid] = {
                    maxRss: maxRss,
                    maxHeap: maxHeap,
                    totalGCTime: maxGCTimeSeconds
                };
                
            }

            // Calculate overall max RSS by summing per-timestamp totals
            // Use forward-filling to avoid drops when a process skips a sample
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            const lastKnownRSS = {};
            processKeys.forEach(processKey => {
                lastKnownRSS[processKey] = 0;
            });

            timestamps.forEach(timestamp => {
                let total = 0;
                let hasAnyProcess = false;

                processKeys.forEach(processKey => {
                    const [processName, pid] = processKey.split('|');
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];

                    if (sample) {
                        lastKnownRSS[processKey] = sample.RSS;
                        total += sample.RSS;
                        hasAnyProcess = true;
                    } else if (lastKnownRSS[processKey] > 0) {
                        total += lastKnownRSS[processKey];
                        hasAnyProcess = true;
                    }
                });

                if (hasAnyProcess && total > maxRssAllProcesses) {
                    maxRssAllProcesses = total;
                }
            });
            
            // Render process info section
            let processInfoHtml = '';
            if (Object.keys(processInfo).length > 0) {
                processInfoHtml = '<div class="process-info-section">';
                processInfoHtml += '<h2>Process Information</h2>';
                for (const [pid, info] of Object.entries(processInfo)) {
                    const vmFlags = info.vm_flags || [];
                    const metrics = processMetrics[pid] || { maxRss: 0, maxHeap: 0, totalGCTime: 0 };
                    const maxHeapGiB = getMaxHeapGiB(vmFlags);
                    processInfoHtml += '<div class="process-info-card">';
                    processInfoHtml += `<h3>${info.name || 'Unknown'}${maxHeapGiB ? ` <span style="font-weight: 500; color: #475569; font-size: 0.95rem;">(Heap Max: ${maxHeapGiB} GiB)</span>` : ''}</h3>`;
                    processInfoHtml += `<div class="process-meta">PID: ${pid}</div>`;
                    
                    // Add metrics
                    processInfoHtml += '<div style="margin: 1rem 0; padding: 0.75rem; background: #f0f9ff; border-radius: 0.5rem; border-left: 3px solid #2563eb;">';
                    processInfoHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 0.5rem;">';
                    processInfoHtml += `<div><strong>Max RSS:</strong> ${metrics.maxRss > 0 ? metrics.maxRss.toFixed(1) + ' MB' : 'N/A'}</div>`;
                    processInfoHtml += `<div><strong>Max Heap:</strong> ${metrics.maxHeap > 0 ? metrics.maxHeap.toFixed(1) + ' MB' : 'N/A'}</div>`;
                    processInfoHtml += `<div><strong>Total GC Time:</strong> ${metrics.totalGCTime > 0 ? metrics.totalGCTime.toFixed(3) + ' s' : 'N/A'}</div>`;
                    processInfoHtml += '</div>';
                    processInfoHtml += '</div>';
                    
                    if (vmFlags.length > 0) {
                        processInfoHtml += '<div><strong>VM Flags:</strong></div>';
                        processInfoHtml += '<div class="vm-flags-list">';
                        vmFlags.forEach(flag => {
                            processInfoHtml += `<span class="vm-flag">${escapeHtml(flag)}</span>`;
                        });
                        processInfoHtml += '</div>';
                    } else {
                        processInfoHtml += '<div class="process-meta">No VM flags available</div>';
                    }
                    processInfoHtml += '</div>';
                }
                
                // Add summary section for max RSS across all processes
                if (maxRssAllProcesses > 0) {
                    processInfoHtml += '<div class="process-info-card" style="background: #fef3c7; border-left: 3px solid #f59e0b;">';
                    processInfoHtml += '<h3>Overall Summary</h3>';
                    processInfoHtml += `<div style="font-size: 1.125rem; font-weight: 600; color: #92400e;">Max RSS (All Processes): ${maxRssAllProcesses.toFixed(1)} MB</div>`;
                    processInfoHtml += '</div>';
                }
                
                processInfoHtml += '</div>';
            }
            
            document.getElementById('content').innerHTML = `
                <div class="run-info">
                    <h2>Run Details</h2>
                    <p><strong>Run ID:</strong> <code>${runId}</code></p>
                    ${data.finished_at ? `<p><strong>Finished:</strong> ${new Date(data.finished_at).toLocaleString()}</p>` : ''}
                    ${data.updated_at ? `<p><strong>Last Updated:</strong> ${new Date(data.updated_at).toLocaleString()}</p>` : ''}
                </div>

                ${!isFinished ? `
                    <div class="refresh-controls">
                        <label for="refreshInterval">🔄 Auto-refresh interval:</label>
                        <select id="refreshInterval" onchange="setRefreshInterval(parseInt(this.value))">
                            <option value="5" ${refreshInterval === 5 ? 'selected' : ''}>5 seconds</option>
                            <option value="10" ${refreshInterval === 10 ? 'selected' : ''}>10 seconds</option>
                            <option value="30" ${refreshInterval === 30 ? 'selected' : ''}>30 seconds</option>
                            <option value="60" ${refreshInterval === 60 ? 'selected' : ''}>1 minute</option>
                            <option value="120" ${refreshInterval === 120 ? 'selected' : ''}>2 minutes</option>
                            <option value="300" ${refreshInterval === 300 ? 'selected' : ''}>5 minutes</option>
                        </select>
                        <span class="status-text">Last refresh: ${lastRefreshText}</span>
                    </div>
                ` : ''}

                <div class="status-grid">
                    <div class="status-card">
                        <h3>Status</h3>
                        <p class="${isFinished ? 'status-completed' : 'status-in-progress'}">
                            ${isFinished ? 'Completed' : 'In Progress'}
                        </p>
                    </div>
                    <div class="status-card">
                        <h3>Samples</h3>
                        <p>${samples.length}</p>
                    </div>
                    <div class="status-card">
                        <h3>Processes</h3>
                        <p>${new Set(samples.map(s => `${s.Name}|${s.PID}`)).size}</p>
                    </div>
                    <div class="status-card">
                        <h3>Auto-refresh</h3>
                        <p>${refreshStatus}</p>
                    </div>
                </div>

                <!-- Compare builds hidden until ready -->

                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-png">Download PNG</button>
                        <button class="btn" id="btn-download-svg">Download SVG</button>
                        <button class="btn secondary" id="btn-download-json">Download JSON</button>
                        <button class="btn secondary" id="btn-download-csv">Download CSV</button>
                    </div>
                    ${isFinished === true && samples.length ? `
                        <div class="replay-controls" id="rss-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-rss-replay-play">Play</button>
                                <button class="btn secondary" id="btn-rss-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-rss-replay-reset">Reset</button>
                            </div>
                            <div class="meta" id="rss-replay-meta">Frame 0 / 0</div>
                            <div class="timeline">
                                <input type="range" id="rss-replay-timeline" min="0" max="0" value="0">
                                <div class="meta" id="rss-replay-time-label">Elapsed: 0s</div>
                                <div class="meta">
                                    Speed:
                                    <select id="rss-replay-speed">
                                        <option value="5">5x</option>
                                        <option value="10">10x</option>
                                        <option value="15" selected>15x</option>
                                        <option value="20">20x</option>
                                        <option value="25">25x</option>
                                        <option value="30">30x</option>
                                        <option value="35">35x</option>
                                        <option value="40">40x</option>
                                        <option value="45">45x</option>
                                        <option value="50">50x</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="chart-filters" id="main-chart-filters">
                            <label><input type="checkbox" id="filter-total-rss" checked> Total RSS</label>
                            <label><input type="checkbox" id="filter-rss" checked> RSS</label>
                            <label><input type="checkbox" id="filter-heap" checked> Heap</label>
                        </div>
                    ` : ''}
                    <h3>Memory Usage Over Time</h3>
                    <div class="chart-wrapper">
                        <div id="chart" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>

                ${hasGCData(samples) ? `
                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-gc-png">Download GC PNG</button>
                        <button class="btn" id="btn-download-gc-svg">Download GC SVG</button>
                    </div>
                    ${isFinished === true ? `
                        <div class="replay-controls" id="gc-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-gc-replay-play">Play</button>
                                <button class="btn secondary" id="btn-gc-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-gc-replay-reset">Reset</button>
                            </div>
                            <div class="meta" id="gc-replay-meta">Frame 0 / 0</div>
                            <div class="timeline">
                                <input type="range" id="gc-replay-timeline" min="0" max="0" value="0">
                                <div class="meta" id="gc-replay-time-label">Elapsed: 0s</div>
                                <div class="meta">
                                    Speed:
                                    <select id="gc-replay-speed">
                                        <option value="5">5x</option>
                                        <option value="10">10x</option>
                                        <option value="15" selected>15x</option>
                                        <option value="20">20x</option>
                                        <option value="25">25x</option>
                                        <option value="30">30x</option>
                                        <option value="35">35x</option>
                                        <option value="40">40x</option>
                                        <option value="45">45x</option>
                                        <option value="50">50x</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    <h3>Garbage Collection Time Over Time</h3>
                    <div class="chart-wrapper">
                        <div id="gc-chart" style="width: 100%; height: 500px;"></div>
                    </div>
                </div>
                ` : ''}
                ${shouldShowRssHeapRatioChart(samples) ? `
                <div class="chart-container">
                    <div class="downloads-toolbar">
                        <button class="btn" id="btn-download-rss-heap-png">Download Heap/RSS PNG</button>
                        <button class="btn" id="btn-download-rss-heap-svg">Download Heap/RSS SVG</button>
                    </div>
                    ${isFinished === true ? `
                        <div class="replay-controls" id="ratio-replay-controls">
                            <div class="buttons">
                                <button class="btn" id="btn-ratio-replay-play">Play</button>
                                <button class="btn secondary" id="btn-ratio-replay-pause">Pause</button>
                                <button class="btn secondary" id="btn-ratio-replay-reset">Reset</button>
                            </div>

                ${processInfoHtml}

                ${isFinished === true ? `
                    <div class="compare-controls">

                        <input type="file" id="compare-file-input" accept=".csv">

            `;

            if (samples.length > 0) {
                renderChart(samples);
                setupMainChartFilters();
                if (hasGCData(samples)) {
                    renderGCChart(samples);
                }
                if (shouldShowRssHeapRatioChart(samples)) {
                    renderRssHeapRatioChart(samples);
                }
                if (isFinished === true) {
                    setupCompareControls(samples);
                    initReplay(samples);
                }
            }

            // Wire download buttons
            const btnPng = document.getElementById('btn-download-png');
            const btnSvg = document.getElementById('btn-download-svg');
            const btnJson = document.getElementById('btn-download-json');
            const btnCsv = document.getElementById('btn-download-csv');
            const btnGcPng = document.getElementById('btn-download-gc-png');
            const btnGcSvg = document.getElementById('btn-download-gc-svg');

            const btnRssHeapSvg = document.getElementById('btn-download-rss-heap-svg');

            if (btnSvg) btnSvg.onclick = () => downloadChart('svg');

            if (btnCsv) btnCsv.onclick = () => downloadCsv(runId);
            if (btnGcPng) btnGcPng.onclick = () => downloadGCChart('png');
            if (btnGcSvg) btnGcSvg.onclick = () => downloadGCChart('svg');
            if (btnRssHeapPng) btnRssHeapPng.onclick = () => downloadRssHeapRatioChart('png');
            if (btnRssHeapSvg) btnRssHeapSvg.onclick = () => downloadRssHeapRatioChart('svg');
        }

        function hasGCData(samples) {
            return samples.some(sample => {
                if (sample.GCTimeSeconds !== undefined && sample.GCTimeSeconds !== null) {
                    return !Number.isNaN(sample.GCTimeSeconds);
                }
                return sample.GCTime !== undefined && sample.GCTime !== null && !Number.isNaN(sample.GCTime);
            });
        }

        function shouldShowRssHeapRatioChart(samples) {
            const uniqueTimestamps = new Set(samples.map(s => s.Timestamp));
            return uniqueTimestamps.size > 10;
        }

        const COLOR_PALETTE = [
            '#3498db',
            '#e74c3c',
            '#9b59b6',
            '#2ecc71',
            '#f39c12',
            '#e67e22',
            '#1abc9c',
            '#e91e63'
        ];

        const traceVisibility = {};

        function buildColorMap(processKeys, palette = COLOR_PALETTE) {
            const colorMap = {};
            processKeys.forEach((processKey, index) => {
                colorMap[processKey] = palette[index % palette.length];
            });
            return colorMap;
        }

        function applyVisibilityToTraces(chartId, traces) {
            const map = traceVisibility[chartId];
            if (!map) return traces;
            traces.forEach(trace => {
                if (trace && trace.name && map[trace.name] !== undefined) {
                    trace.visible = map[trace.name];
                }
            });
            return traces;
        }

        function attachLegendVisibilityHandlers(chartId) {
            const chart = document.getElementById(chartId);
            if (!chart || chart.__visibilityHandlersAttached) return;
            chart.on('plotly_restyle', (eventData) => {
                const update = eventData[0];
                const indices = eventData[1];
                if (!update || update.visible === undefined) return;
                const vis = update.visible;
                const map = traceVisibility[chartId] || (traceVisibility[chartId] = {});
                indices.forEach((traceIndex, idx) => {
                    const trace = chart.data && chart.data[traceIndex];
                    if (!trace || !trace.name) return;
                    map[trace.name] = Array.isArray(vis) ? vis[idx] : vis;
                });
                if (chartId === 'chart') {
                    updateMainChartFilterCheckboxes();
                }
            });
            chart.__visibilityHandlersAttached = true;
        }

        function updateMainChartFilterCheckboxes() {
            const total = document.getElementById('filter-total-rss');
            const rss = document.getElementById('filter-rss');
            const heap = document.getElementById('filter-heap');
            const chart = document.getElementById('chart');
            if (!total || !rss || !heap || !chart || !chart.data) return;
            const map = traceVisibility['chart'] || {};

            let rssVisible = false;
            let heapVisible = false;
            chart.data.forEach(trace => {
                if (!trace.name) return;
                const vis = map[trace.name];
                const isVisible = vis !== 'legendonly' && vis !== false;
                if (trace.name.includes('(RSS)')) rssVisible = rssVisible || isVisible;
                if (trace.name.includes('(Heap)')) heapVisible = heapVisible || isVisible;
            });
            const totalVis = map['Total RSS Memory'];
            total.checked = totalVis === undefined ? true : (totalVis !== 'legendonly' && totalVis !== false);
            rss.checked = rssVisible;
            heap.checked = heapVisible;
        }

        function setupMainChartFilters() {
            const total = document.getElementById('filter-total-rss');
            const rss = document.getElementById('filter-rss');
            const heap = document.getElementById('filter-heap');
            if (!total || !rss || !heap) return;

            const applyFilters = () => {
                const chart = document.getElementById('chart');
                if (!chart || !chart.data) return;
                const map = traceVisibility['chart'] || (traceVisibility['chart'] = {});

                chart.data.forEach(trace => {
                    if (!trace.name) return;
                    if (trace.name === 'Total RSS Memory') {
                        map[trace.name] = total.checked ? true : 'legendonly';
                    } else if (trace.name.includes('(RSS)')) {
                        map[trace.name] = rss.checked ? true : 'legendonly';
                    } else if (trace.name.includes('(Heap)')) {
                        map[trace.name] = heap.checked ? true : 'legendonly';
                    }
                });

                const visArray = chart.data.map(trace => map[trace.name] !== undefined ? map[trace.name] : true);
                Plotly.restyle(chart, 'visible', visArray);
            };

            total.addEventListener('change', applyFilters);
            rss.addEventListener('change', applyFilters);
            heap.addEventListener('change', applyFilters);

            applyFilters();
        }

        function getMaxHeapGiB(vmFlags) {
            if (!Array.isArray(vmFlags)) return null;
            const flag = vmFlags.find(entry => entry.startsWith('-XX:MaxHeapSize='));
            if (!flag) return null;
            const value = Number(flag.split('=')[1]);
            if (!Number.isFinite(value) || value <= 0) return null;
            const gib = value / (1024 * 1024 * 1024);
            return gib.toFixed(2);
        }

        function getMedianDelta(timestamps) {
            if (!timestamps || timestamps.length < 2) return 0;
            const deltas = [];
            for (let i = 1; i < timestamps.length; i += 1) {
                deltas.push(timestamps[i] - timestamps[i - 1]);
            }
            deltas.sort((a, b) => a - b);
            const mid = Math.floor(deltas.length / 2);
            return deltas.length % 2 === 0 ? (deltas[mid - 1] + deltas[mid]) / 2 : deltas[mid];
        }

        function buildTotalRssSeries(samples, timestamps, processKeys) {
            const lastKnown = {};
            const lastSeen = {};
            const cursors = {};
            const perProcessSamples = {};

            processKeys.forEach(processKey => {
                lastKnown[processKey] = 0;
                lastSeen[processKey] = 0;
                cursors[processKey] = 0;
                const [processName, pid] = processKey.split('|');
                perProcessSamples[processKey] = samples
                    .filter(s => s.Name === processName && s.PID === pid)
                    .sort((a, b) => a.Timestamp - b.Timestamp);
            });

            const medianDelta = getMedianDelta(timestamps);
            const maxGap = medianDelta ? medianDelta * 2 : 0;
            const totalRss = [];
            const distribution = [];

            timestamps.forEach(timestamp => {
                let total = 0;
                const included = {};

                processKeys.forEach(processKey => {
                    const list = perProcessSamples[processKey];
                    let cursor = cursors[processKey];
                    while (cursor < list.length && list[cursor].Timestamp <= timestamp) {
                        const sample = list[cursor];
                        if (sample.RSS && sample.RSS > 0) {
                            lastKnown[processKey] = sample.RSS;
                        } else {
                            lastKnown[processKey] = 0;
                        }
                        lastSeen[processKey] = sample.Timestamp;
                        cursor += 1;
                    }
                    cursors[processKey] = cursor;

                    const recentlySeen = maxGap > 0 && lastSeen[processKey] > 0 && (timestamp - lastSeen[processKey]) <= maxGap;
                    if (lastKnown[processKey] > 0 && (recentlySeen || lastSeen[processKey] === timestamp)) {
                        total += lastKnown[processKey];
                        included[processKey] = lastKnown[processKey];
                    }
                });

                totalRss.push(total > 0 ? total : null);

                if (total <= 0) {
                    distribution.push('No data');
                } else {
                    const lines = [];
                    processKeys.forEach(processKey => {
                        const rss = included[processKey];
                        if (!rss) return;
                        const [processName, pid] = processKey.split('|');
                        const percent = ((rss / total) * 100).toFixed(1);
                        lines.push(`${processName} PID:${pid}: ${percent}%`);
                    });
                    distribution.push(lines.join('<br>'));
                }
            });

            return { totalRss, distribution };
        }

        function renderGCChart(samples) {
            // Process data for GC chart - group by both Name and PID to handle multiple processes with same name
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            // Create unique process keys (Name + PID combination)
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            
            const traces = [];
            const colorMap = buildColorMap(processKeys);
            
            // Create traces for each unique process (Name + PID combination)
            processKeys.forEach((processKey, index) => {
                const color = colorMap[processKey];
                const [processName, pid] = processKey.split('|');
                
                // GC time data - use null for timestamps where process doesn't exist yet
                // Convert from milliseconds (stored in DB) to seconds (for display)
                const gcData = timestamps.map(timestamp => {
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];
                    return sample && sample.GCTime !== undefined && sample.GCTime !== null && !Number.isNaN(sample.GCTime) ? sample.GCTime / 1000 : null;
                });
                
                traces.push({
                    x: timestamps.map(t => new Date(t)),
                    y: gcData,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: `${processName} PID:${pid}`,
                    line: { color: color, width: 3 },
                    marker: { size: 6, color: color },
                    connectgaps: false
                });
            });

            // Total GC line intentionally omitted.

            // Detect if mobile
            const isMobile = window.innerWidth < 768;
            
            const layout = {
                title: isMobile ? '' : 'Garbage Collection Time Over Time',
                xaxis: { 
                    title: 'Time',
                    tickformat: isMobile ? '%H:%M' : '%H:%M:%S',
                    tickangle: isMobile ? -45 : 0
                },
                yaxis: { title: 'GC Time (s)' },
                showlegend: true,
                legend: { 
                    x: isMobile ? 0.5 : 1.02, 
                    y: isMobile ? -0.2 : 1,
                    xanchor: isMobile ? 'center' : 'left',
                    orientation: isMobile ? 'h' : 'v'
                },
                margin: {

                }

            const config = {

            Plotly.newPlot('gc-chart', applyVisibilityToTraces('gc-chart', traces), layout, config);
            attachLegendVisibilityHandlers('gc-chart');
            
            // Handle window resize
            window.addEventListener('resize', function() {
                Plotly.Plots.resize('gc-chart');
            });
        }

        function renderRssHeapRatioChart(samples) {
            // Process data for Heap/RSS ratio chart - group by both Name and PID to handle multiple processes with same name
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            // Create unique process keys (Name + PID combination)
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            
            const traces = [];
            const colorMap = buildColorMap(processKeys);
            
            // Create traces for each unique process (Name + PID combination)
            processKeys.forEach((processKey, index) => {
                const color = colorMap[processKey];
                const [processName, pid] = processKey.split('|');
                
                // Heap/RSS ratio data - use null for timestamps where process doesn't exist yet or RSS is 0
                const ratioData = timestamps.map(timestamp => {
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];
                    if (sample && sample.RSS && sample.RSS > 0) {
                        return sample.HeapUsed / sample.RSS;
                    }
                    return null;
                });
                
                traces.push({
                    x: timestamps.map(t => new Date(t)),
                    y: ratioData,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: `${processName} PID:${pid}`,
                    line: { color: color, width: 3 },
                    marker: { size: 6, color: color },

            // Total Heap/RSS ratio line intentionally omitted.

            // Detect if mobile
            const isMobile = window.innerWidth < 768;
            
            const layout = {
                title: isMobile ? '' : 'Heap/RSS Ratio Over Time',
                xaxis: { 
                    title: 'Time',
                    tickformat: isMobile ? '%H:%M' : '%H:%M:%S',
                    tickangle: isMobile ? -45 : 0
                },
                yaxis: { title: 'Heap/RSS Ratio' },
                showlegend: true,
                legend: { 
                    x: isMobile ? 0.5 : 1.02, 
                    y: isMobile ? -0.2 : 1,
                    xanchor: isMobile ? 'center' : 'left',
                    orientation: isMobile ? 'h' : 'v'
                },
                margin: { 
                    l: isMobile ? 50 : 60, 
                    r: isMobile ? 20 : 100, 
                    t: isMobile ? 20 : 40, 
                    b: isMobile ? 80 : 60 
                },
                font: {
                    size: isMobile ? 10 : 12
                }
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d', 'autoScale2d'],
                toImageButtonOptions: {

            Plotly.newPlot('rss-heap-chart', applyVisibilityToTraces('rss-heap-chart', traces), layout, config);
            attachLegendVisibilityHandlers('rss-heap-chart');
            
            // Handle window resize
            window.addEventListener('resize', function() {
                Plotly.Plots.resize('rss-heap-chart');
            });
        }

        function initReplay(samples) {
            const timestamps = [...new Set(samples.map(s => s.Timestamp))].sort((a, b) => a - b);
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            const elapsedByTimestamp = new Map();
            samples.forEach(sample => {
                if (!elapsedByTimestamp.has(sample.Timestamp)) {
                    elapsedByTimestamp.set(sample.Timestamp, sample.ElapsedTime);
                }
            });

            const series = {};
            const colorMap = buildColorMap(processKeys);

            processKeys.forEach((processKey, index) => {
                const [processName, pid] = processKey.split('|');
                const rss = buildForwardFilledSeries(samples, timestamps, processName, pid, s => s.RSS);
                const heap = buildForwardFilledSeries(samples, timestamps, processName, pid, s => s.HeapUsed);
                const gc = buildForwardFilledSeries(samples, timestamps, processName, pid, s => {
                    const gcSeconds = s.GCTimeSeconds ?? (s.GCTime !== null && s.GCTime !== undefined && !Number.isNaN(s.GCTime)
                        ? s.GCTime / 1000
                        : null);
                    return gcSeconds === null || Number.isNaN(gcSeconds) ? null : gcSeconds;
                });
                const ratio = buildExactSeries(samples, timestamps, processName, pid, s => {
                    if (!s.RSS || s.RSS <= 0) return null;
                    return s.HeapUsed / s.RSS;
                });

                series[processKey] = {
                    processName,
                    pid,
                    color: colorMap[processKey],
                    rss,
                    heap,
                    gc,
                    ratio,
                    firstRss: rss.findIndex(value => value !== null),
                    firstGc: gc.findIndex(value => value !== null),
                    firstRatio: ratio.findIndex(value => value !== null)
                };
            });

            const totalSeries = buildTotalRssSeries(samples, timestamps, processKeys);
            const firstTotalRssIndex = totalSeries.totalRss.findIndex(value => value !== null);

            function buildMemoryTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstRss === -1 || frameIndex < def.firstRss) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.rss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (RSS)`,
                        line: { color: def.color, width: 3 },
                        connectgaps: false
                    });
                    traces.push({
                        x: frameTimestamps,
                        y: def.heap.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (Heap)`,
                        line: { color: def.color, width: 2, dash: 'dash' },
                        connectgaps: false
                    });
                });
                if (firstTotalRssIndex !== -1 && frameIndex >= firstTotalRssIndex) {
                    traces.push({
                        x: frameTimestamps,
                        y: totalSeries.totalRss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: 'Total RSS Memory',
                        line: { color: '#2c3e50', width: 4 },
                        connectgaps: false,
                        customdata: totalSeries.distribution.slice(0, frameIndex + 1),
                        hovertemplate: 'Total RSS: %{y} MB<br>%{customdata}<extra></extra>'
                    });
                }
                return applyVisibilityToTraces('chart', traces);
            }

            function buildGCTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstGc === -1 || frameIndex < def.firstGc) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.gc.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: `${def.processName} PID:${def.pid}`,
                        line: { color: def.color, width: 3 },
                        marker: { size: 6, color: def.color },
                        connectgaps: false
                    });
                });
                return applyVisibilityToTraces('gc-chart', traces);
            }

            function buildRatioTraces(frameIndex) {
                const frameTimestamps = timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
                const traces = [];
                processKeys.forEach(processKey => {
                    const def = series[processKey];
                    if (def.firstRatio === -1 || frameIndex < def.firstRatio) return;
                    traces.push({
                        x: frameTimestamps,
                        y: def.ratio.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines+markers',
                        name: `${def.processName} PID:${def.pid}`,
                        line: { color: def.color, width: 3 },
                        marker: { size: 6, color: def.color },
                        connectgaps: false
                    });
                });
                return applyVisibilityToTraces('rss-heap-chart', traces);
            }

            function setupReplayPanel(options) {
                const { panelKey, chartId, controlsId, buildTraces, layoutGetter, configGetter } = options;
                const controls = document.getElementById(controlsId);
                const chart = document.getElementById(chartId);
                if (!controls || !chart) return;

                if (!window.replayStops) {
                    window.replayStops = {};
                }
                if (window.replayStops[panelKey]) {
                    window.replayStops[panelKey]();
                }

                const timeline = document.getElementById(`${panelKey}-replay-timeline`);
                const meta = document.getElementById(`${panelKey}-replay-meta`);
                const timeLabel = document.getElementById(`${panelKey}-replay-time-label`);
                const playBtn = document.getElementById(`btn-${panelKey}-replay-play`);
                const pauseBtn = document.getElementById(`btn-${panelKey}-replay-pause`);
                const resetBtn = document.getElementById(`btn-${panelKey}-replay-reset`);
                const speedSelect = document.getElementById(`${panelKey}-replay-speed`);

                let isPlaying = false;
                let playTimer = null;
                let currentFrame = 0;
                let speedMultiplier = Number(speedSelect.value) || 15;

                timeline.max = String(Math.max(0, timestamps.length - 1));

                function updateUi(frameIndex) {
                    timeline.value = String(frameIndex);
                    meta.textContent = `Frame ${frameIndex + 1} / ${timestamps.length}`;
                    const timestamp = timestamps[frameIndex];
                    const elapsed = elapsedByTimestamp.get(timestamp);
                    const timeText = new Date(timestamp).toLocaleTimeString();
                    timeLabel.textContent = `Elapsed: ${elapsed}s | ${timeText}`;
                }

                function renderFrame(frameIndex) {
                    currentFrame = frameIndex;
                    updateUi(frameIndex);
                    return Plotly.react(chartId, buildTraces(frameIndex), layoutGetter(), configGetter());
                }

                function scheduleNext() {
                    if (!isPlaying) return;
                    if (currentFrame >= timestamps.length - 1) {
                        isPlaying = false;
                        return;
                    }
                    const nextDelay = Math.max(
                        16,
                        (timestamps[currentFrame + 1] - timestamps[currentFrame]) / speedMultiplier
                    );
                    playTimer = setTimeout(() => {
                        renderFrame(currentFrame + 1).then(scheduleNext);
                    }, nextDelay);
                }

                function play() {
                    if (isPlaying) return;
                    isPlaying = true;
                    scheduleNext();
                }

                function pause() {
                    isPlaying = false;
                    if (playTimer) {
                        clearTimeout(playTimer);
                        playTimer = null;
                    }
                }

                window.replayStops[panelKey] = pause;

                playBtn.addEventListener('click', play);
                pauseBtn.addEventListener('click', pause);
                resetBtn.addEventListener('click', () => {
                    pause();
                    renderFrame(0);
                });
                timeline.addEventListener('input', () => {
                    pause();
                    renderFrame(Number(timeline.value));
                });
                speedSelect.addEventListener('change', () => {
                    const parsed = Number(speedSelect.value);
                    if (!Number.isNaN(parsed) && parsed > 0) {
                        speedMultiplier = parsed;
                    }
                });

                const initialFrame = Math.max(0, timestamps.length - 1);
                renderFrame(initialFrame).then(() => {
                    attachLegendVisibilityHandlers(chartId);
                });
            }

            setupReplayPanel({
                panelKey: 'rss',
                chartId: 'chart',
                controlsId: 'rss-replay-controls',
                buildTraces: buildMemoryTraces,
                layoutGetter: getMemoryLayout,
                configGetter: getMemoryConfig
            });
            setupReplayPanel({
                panelKey: 'gc',
                chartId: 'gc-chart',
                controlsId: 'gc-replay-controls',

                configGetter: getGcConfig
            });
            setupReplayPanel({
                panelKey: 'ratio',
                chartId: 'rss-heap-chart',
                controlsId: 'ratio-replay-controls',
                buildTraces: buildRatioTraces,

        function setupCompareControls(samples) {
            const input = document.getElementById('compare-file-input');
            const clearBtn = document.getElementById('compare-clear');
            const fileName = document.getElementById('compare-file-name');
            const compareSection = document.getElementById('compare-section');
            if (!input || !clearBtn || !fileName) return;

            input.addEventListener('change', () => {
                const file = input.files && input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const text = String(reader.result || '');
                        const parsed = parseCsvText(text);
                        window.compareSamples = parsed;
                        fileName.textContent = file.name;
                        clearBtn.style.display = 'inline-flex';
                        if (compareSection) compareSection.style.display = 'block';
                        renderCompareSection(samples);
                        initReplay(samples);
                    } catch (err) {
                        console.error('Failed to parse comparison CSV', err);
                        window.compareSamples = [];
                        fileName.textContent = 'Failed to parse CSV';
                    }
                };
                reader.readAsText(file);
            });

            clearBtn.addEventListener('click', () => {
                window.compareSamples = [];
                fileName.textContent = 'No file selected';
                clearBtn.style.display = 'none';
                input.value = '';
                if (compareSection) compareSection.style.display = 'none';
                if (compareSection) compareSection.innerHTML = '';
                initReplay(samples);
            });

        function parseCsvText(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const headerIndex = {};
            headers.forEach((header, index) => {
                headerIndex[header] = index;
            });

            const parsed = lines.slice(1).map(line => {
                const values = line.split(',');
                const get = (key) => {
                    const index = headerIndex[key];
                    return index === undefined ? '' : values[index];
                };
                const timestamp = Number(get('timestamp'));
                const elapsed = Number(get('elapsed_time'));
                const gcRaw = get('gc_time_s');
                const gcValue = gcRaw !== '' ? Number(gcRaw) : null;
                return {
                    Timestamp: Number.isNaN(timestamp) ? 0 : timestamp,
                    ElapsedTime: Number.isNaN(elapsed) ? 0 : elapsed,
                    PID: get('pid'),
                    Name: get('name'),
                    RSS: Number(get('rss_mb')) || 0,
                    HeapUsed: Number(get('heap_used_mb')) || 0,
                    HeapCap: Number(get('heap_capacity_mb')) || 0,
                    GCTime: gcValue !== null && !Number.isNaN(gcValue) ? gcValue * 1000 : null,
                    GCTimeSeconds: gcValue !== null && !Number.isNaN(gcValue) ? gcValue : null
                };
            });
            console.log('[compare] Parsed CSV rows:', parsed.length);
            console.log('[compare] CSV headers:', headers);
            console.log('[compare] Sample GC seconds:', parsed.slice(0, 5).map(row => row.GCTimeSeconds));
            return parsed;
        }

        function normalizeCompareSamples(samples, baseTimestamp) {
            if (!samples.length || !baseTimestamp) return [];
            return samples.map(sample => {
                const elapsedMs = (sample.ElapsedTime || 0) * 1000;
                const timestamp = baseTimestamp + elapsedMs;
                return {
                    ...sample,
                    Timestamp: timestamp
                };
            });
        }

        function buildForwardFilledSeries(samples, timestamps, processName, pid, valueSelector) {
            const filtered = samples
                .filter(s => s.Name === processName && s.PID === pid)
                .sort((a, b) => a.Timestamp - b.Timestamp);
            const values = [];
            let idx = 0;
            let lastValue = null;
            let lastSeen = 0;
            const medianDelta = getMedianDelta(timestamps);
            const maxGap = medianDelta ? medianDelta * 2 : 0;

            for (const timestamp of timestamps) {
                while (idx < filtered.length && filtered[idx].Timestamp <= timestamp) {
                    const candidate = valueSelector(filtered[idx]);
                    if (candidate !== null && candidate !== undefined) {
                        lastValue = candidate;
                    }
                    lastSeen = filtered[idx].Timestamp;
                    idx += 1;
                }

                if (maxGap > 0 && lastSeen > 0 && (timestamp - lastSeen) > maxGap) {
                    lastValue = null;
                }

                values.push(lastValue);
            }
            return values;
        }

        function buildExactSeries(samples, timestamps, processName, pid, valueSelector) {
            const byTimestamp = new Map();
            samples.forEach(sample => {
                if (sample.Name === processName && sample.PID === pid) {
                    byTimestamp.set(sample.Timestamp, valueSelector(sample));
                }
            });
            return timestamps.map(timestamp => {
                const value = byTimestamp.get(timestamp);
                return value === undefined ? null : value;
            });
        }

        function buildReplayData(samples, timestamps, palette = COLOR_PALETTE) {
            const processKeys = [...new Set(samples.map(s => `${s.Name}|${s.PID}`))];
            const colorMap = buildColorMap(processKeys, palette);
            const series = {};

            processKeys.forEach(processKey => {
                const [processName, pid] = processKey.split('|');
                const rss = buildForwardFilledSeries(samples, timestamps, processName, pid, s => s.RSS);
                const heap = buildForwardFilledSeries(samples, timestamps, processName, pid, s => s.HeapUsed);
                const gc = buildExactSeries(samples, timestamps, processName, pid, s => {
                    if (s.GCTime === undefined || s.GCTime === null || Number.isNaN(s.GCTime)) return null;
                    return s.GCTime / 1000;
                });
                const ratio = buildExactSeries(samples, timestamps, processName, pid, s => {
                    if (!s.RSS || s.RSS <= 0) return null;
                    return s.HeapUsed / s.RSS;
                });

                series[processKey] = {
                    processName,
                    pid,
                    color: colorMap[processKey],
                    rss,
                    heap,
                    gc,
                    ratio,
                    firstRss: rss.findIndex(value => value !== null),
                    firstGc: gc.findIndex(value => value !== null),
                    firstRatio: ratio.findIndex(value => value !== null)
                };
            });

            const totalSeries = buildTotalRssSeries(samples, timestamps, processKeys);

            return {
                processKeys,
                series,
                totalRss: totalSeries.totalRss,
                totalRssDistribution: totalSeries.distribution,
                firstTotalRssIndex: totalSeries.totalRss.findIndex(value => value !== null)
            };
        }

        function buildMetricTraces(data, timestamps, frameIndex, metric, style, xValues) {
            const lineWidth = style?.lineWidth ?? 3;
            const heapLineWidth = style?.heapLineWidth ?? 2;
            const markerSize = style?.markerSize ?? 6;
            const heapDash = style?.heapDash ?? 'dash';
            const lineDash = style?.lineDash ?? 'solid';
            const lineOpacity = style?.lineOpacity ?? 1;
            const markerOpacity = style?.markerOpacity ?? 1;
            const includeTotalRss = style?.includeTotalRss ?? false;
            const totalLabel = style?.totalLabel ?? 'Total RSS Memory';
            const totalColor = style?.totalColor ?? '#2c3e50';
            const frameTimestamps = xValues
                ? xValues.slice(0, frameIndex + 1)
                : timestamps.slice(0, frameIndex + 1).map(t => new Date(t));
            const traces = [];
            data.processKeys.forEach(processKey => {
                const def = data.series[processKey];
                const firstIndex = metric === 'gc' ? def.firstGc : metric === 'ratio' ? def.firstRatio : def.firstRss;
                if (firstIndex === -1 || frameIndex < firstIndex) return;
                if (metric === 'rss') {
                    traces.push({
                        x: frameTimestamps,
                        y: def.rss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (RSS)`,
                        line: { color: def.color, width: lineWidth, dash: lineDash },
                        opacity: lineOpacity,
                        connectgaps: false
                    });
                    traces.push({
                        x: frameTimestamps,
                        y: def.heap.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: `${def.processName} PID:${def.pid} (Heap)`,
                        line: { color: def.color, width: heapLineWidth, dash: heapDash },
                        opacity: lineOpacity,
                        connectgaps: false
                    });
                    return;
                }
                traces.push({
                    x: frameTimestamps,
                    y: metric === 'gc' ? def.gc.slice(0, frameIndex + 1) : def.ratio.slice(0, frameIndex + 1),
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: `${def.processName} PID:${def.pid}`,
                    line: { color: def.color, width: lineWidth, dash: lineDash },
                    marker: { size: markerSize, color: def.color, opacity: markerOpacity },
                    opacity: lineOpacity,
                    connectgaps: false
                });
            });

            if (metric === 'rss' && includeTotalRss && data.totalRss) {
                const firstIndex = data.firstTotalRssIndex ?? -1;
                if (firstIndex !== -1 && frameIndex >= firstIndex) {
                    traces.push({
                        x: frameTimestamps,
                        y: data.totalRss.slice(0, frameIndex + 1),
                        type: 'scatter',
                        mode: 'lines',
                        name: totalLabel,
                        line: { color: totalColor, width: lineWidth + 1, dash: lineDash },
                        opacity: lineOpacity,
                        connectgaps: false,
                        customdata: data.totalRssDistribution ? data.totalRssDistribution.slice(0, frameIndex + 1) : [],
                        hovertemplate: 'Total RSS: %{y} MB<br>%{customdata}<extra></extra>'
                    });
                }
            }
            return traces;
        }

        function renderChart(samples) {

                const rssData = timestamps.map(timestamp => {
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];
                    return sample ? sample.RSS : null;  // null means "no data" - line won't appear
                });
                
                traces.push({
                    x: timestamps.map(t => new Date(t)),
                    y: rssData,
                    type: 'scatter',
                    mode: 'lines',
                    name: `${processName} PID:${pid} (RSS)`,
                    line: { color: color, width: 3 },
                    connectgaps: false  // Don't connect across null values
                });
                
                // Heap data - use null for timestamps where process doesn't exist yet
                const heapData = timestamps.map(timestamp => {
                    const sample = samples
                        .filter(s => s.Name === processName && s.PID === pid && s.Timestamp === timestamp)
                        [0];
                    return sample ? sample.HeapUsed : null;  // null means "no data" - line won't appear
                });
                
                traces.push({
                    x: timestamps.map(t => new Date(t)),
                    y: heapData,
                    type: 'scatter',
                    mode: 'lines',
                    name: `${processName} PID:${pid} (Heap)`,
                    line: { color: color, width: 2, dash: 'dash' },
                    connectgaps: false  // Don't connect across null values
                });
            });
            
            const totalSeries = buildTotalRssSeries(samples, timestamps, processKeys);
            
            traces.push({
                x: timestamps.map(t => new Date(t)),
                y: totalSeries.totalRss,
                type: 'scatter',
                mode: 'lines',
                name: 'Total RSS Memory',
                line: { color: '#2c3e50', width: 4 },
                connectgaps: false,  // Don't connect across null values
                customdata: totalSeries.distribution,
                hovertemplate: 'Total RSS: %{y} MB<br>%{customdata}<extra></extra>'
            });

            // Detect if mobile
            const isMobile = window.innerWidth < 768;
            
            const layout = getMemoryLayout();
            const config = getMemoryConfig();

            Plotly.newPlot('chart', applyVisibilityToTraces('chart', traces), layout, config);
            attachLegendVisibilityHandlers('chart');
            
            // Handle window resize
            window.addEventListener('resize', function() {
                Plotly.Plots.resize('chart');
            });
        }

        function downloadJson(runId) {

        function downloadCsv(runId) {
            try {
                const samples = window.currentSamples || [];
                if (!samples.length) return;
                const hasGC = hasGCData(samples);
                const header = hasGC ? 
                    ['timestamp','elapsed_time','pid','name','rss_mb','heap_used_mb','heap_capacity_mb','gc_time_s'] :
                    ['timestamp','elapsed_time','pid','name','rss_mb','heap_used_mb','heap_capacity_mb'];
                const rows = samples.map(s => {
                    const baseRow = [
                        s.Timestamp,
                        s.ElapsedTime,
                        s.PID,
                        s.Name,
                        s.RSS,
                        s.HeapUsed,
                        s.HeapCap
                    ];
                    if (hasGC) {
                        // Convert from milliseconds (stored in DB) to seconds (for display)
                        baseRow.push(s.GCTime ? (s.GCTime / 1000).toFixed(3) : 0);
                    }
                    return baseRow;
                });
                const csv = [header.join(','), ...rows.map(r => r.map(escapeCsv).join(','))].join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `build-monitor-${runId}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Failed to download CSV:', e);
            }
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeCsv(value) {
            if (value === undefined || value === null) return '';
            const str = String(value);
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }
