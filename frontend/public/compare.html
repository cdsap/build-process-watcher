<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Process Watcher - Compare CSV Runs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #111827;
        }

        .compare-controls {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            align-items: center;
        }

        .compare-controls .meta {
            font-size: 0.875rem;
            color: #334155;
        }

        .compare-controls input[type="file"] {
            font-size: 0.875rem;
        }

        .compare-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 2rem;
        }

        .compare-column h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }

        .chart-container {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .chart-wrapper {
            margin-top: 0.5rem;
        }

        .replay-controls {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .replay-controls .buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .replay-controls .meta {
            color: #0369a1;
            font-size: 0.875rem;
        }

        .replay-controls .timeline {
            margin-top: 0.5rem;
        }

        .btn {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            background: #2563eb;
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn.secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5f5;
        }

        select {
            padding: 0.35rem 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid #cbd5f5;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Compare Build CSVs</h1>
        </header>

        <div class="compare-controls">
            <div>
                <div class="meta"><strong>Current CSV:</strong> select a CSV export</div>
                <input type="file" id="compare-current-file-input" accept=".csv">
                <div class="meta" id="compare-current-file-name">No file selected</div>
            </div>
            <div>
                <div class="meta"><strong>Comparison CSV:</strong> select another CSV export</div>
                <input type="file" id="compare-other-file-input" accept=".csv">
                <div class="meta" id="compare-other-file-name">No file selected</div>
            </div>
            <div class="meta">Load two CSVs to compare on a shared timeline.</div>
        </div>

        <div id="compare-section" class="compare-section" style="display: none;"></div>
    </div>

    <script src="/compare.js"></script>
</body>
</html>
