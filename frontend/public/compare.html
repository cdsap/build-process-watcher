<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Process Watcher - Compare CSVs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/config.js"></script>
    <script src="/compare-shared.js"></script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #111827;
        }

        .meta {
            color: #6b7280;
            font-size: 0.875rem;
        }

        .compare-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            margin-bottom: 2rem;
        }

        .compare-controls .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .compare-controls input[type="file"] {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.4rem 0.6rem;
            font-size: 0.9rem;
        }

        .compare-section {
            display: none;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
        }

        .compare-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 2rem;
        }

        .compare-column h3 {
            font-size: 1.1rem;
            color: #111827;
            margin-bottom: 1rem;
        }

        .chart-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .chart-container h4 {
            font-size: 1rem;
            color: #111827;
            margin-bottom: 0.75rem;
        }

        .replay-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .replay-controls .buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .replay-controls .timeline {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn.secondary {
            background: #6b7280;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .compare-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Compare CSV Builds</h1>
            <div class="meta">Upload two CSV exports to compare memory, GC, and heap/RSS ratio.</div>
        </header>

        <section class="compare-controls">
            <div class="row">
                <strong>Build A CSV</strong>
                <input type="file" id="compare-a-input" accept=".csv">
                <span class="meta" id="compare-a-name">No file selected</span>
            </div>
            <div class="row">
                <strong>Build B CSV</strong>
                <input type="file" id="compare-b-input" accept=".csv">
                <span class="meta" id="compare-b-name">No file selected</span>
            </div>
            <div class="meta" id="compare-hint">Select both CSV files to render the comparison.</div>
        </section>

        <section id="compare-section" class="compare-section"></section>
    </div>

    <script src="/compare.js"></script>
</body>
</html>
