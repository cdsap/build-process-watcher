<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found - Build Process Watcher</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
            background: #f5f7f8;
            color: #161a1d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            width: min(34rem, 100%);
            padding: 3rem;
            border: 1px solid #d8dee2;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(22, 26, 29, 0.08);
            text-align: center;
        }

        .error-code {
            margin: 0 0 0.5rem;
            color: #087f8c;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 8vw, 3rem);
        }

        p {
            margin: 0 0 1.75rem;
            color: #52606a;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: #087f8c;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            background: #066b75;
        }
    </style>
</head>
<body>
    <main>
        <p class="error-code">404</p>
        <h1>Page not found</h1>
        <p>The requested page does not exist. Check the address or return to Build Process Watcher.</p>
        <a href="/">Return home</a>
    </main>
</body>
</html>
