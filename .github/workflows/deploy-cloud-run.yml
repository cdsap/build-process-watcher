name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project ID
        required: true
        type: string
      region:
        description: Cloud Run and Artifact Registry region
        required: true
        default: us-central1
        type: string
      service:
        description: Cloud Run service name
        required: true
        default: bpw-predictive-backend
        type: string
      artifact_registry_repository:
        description: Artifact Registry Docker repository
        required: true
        default: bpw-private
        type: string
      image_name:
        description: Container image name
        required: true
        default: predictive-backend
        type: string
      checkpoints:
        description: Comma-separated prediction checkpoints in seconds
        required: true
        default: 30,60,180
        type: string
      provider_id:
        description: Opaque provider identifier stored with public-safe checkpoints
        required: true
        default: private-provider
        type: string
      model_version:
        description: Opaque model version stored with public-safe checkpoints
        required: true
        default: private-heuristic-v1
        type: string
      allow_unauthenticated:
        description: Allow unauthenticated HTTP access to the Cloud Run service
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  GONOSUMDB: github.com/cdsap/build-process-watcher/backend
  DEPLOY_PROJECT_ID: ${{ inputs.project_id || vars.GCP_PROJECT_ID || 'process-watcher-473421' }}
  DEPLOY_REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
  DEPLOY_SERVICE: ${{ inputs.service || vars.CLOUD_RUN_SERVICE || 'bpw-predictive-backend' }}
  DEPLOY_ARTIFACT_REGISTRY_REPOSITORY: ${{ inputs.artifact_registry_repository || vars.ARTIFACT_REGISTRY_REPOSITORY || 'bpw-private' }}
  DEPLOY_IMAGE_NAME: ${{ inputs.image_name || vars.IMAGE_NAME || 'predictive-backend' }}
  DEPLOY_CHECKPOINTS: ${{ inputs.checkpoints || vars.PREDICTIVE_RELIABILITY_CHECKPOINTS || '30,60,180' }}
  DEPLOY_PROVIDER_ID: ${{ inputs.provider_id || vars.PREDICTIVE_PROVIDER_ID || 'private-provider' }}
  DEPLOY_MODEL_VERSION: ${{ inputs.model_version || vars.PREDICTIVE_MODEL_VERSION || 'private-heuristic-v1' }}
  DEPLOY_ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated || vars.ALLOW_UNAUTHENTICATED || 'false' }}

jobs:
  deploy:
    name: Build and deploy private backend
    runs-on: ubuntu-latest
    environment: cloud-run

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-run-proxy

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.DEPLOY_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE_URI="${{ env.DEPLOY_REGION }}-docker.pkg.dev/${{ env.DEPLOY_PROJECT_ID }}/${{ env.DEPLOY_ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.DEPLOY_IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE_URI"

      - name: Deploy Cloud Run service
        run: |
          AUTH_FLAG="--no-allow-unauthenticated"
          if [ "${{ env.DEPLOY_ALLOW_UNAUTHENTICATED }}" = "true" ]; then
            AUTH_FLAG="--allow-unauthenticated"
          fi

          gcloud run deploy "${{ env.DEPLOY_SERVICE }}" \
            --project "${{ env.DEPLOY_PROJECT_ID }}" \
            --region "${{ env.DEPLOY_REGION }}" \
            --image "$IMAGE_URI" \
            --platform managed \
            --port 8080 \
            --set-env-vars "^:^GOOGLE_CLOUD_PROJECT=${{ env.DEPLOY_PROJECT_ID }}:PREDICTIVE_RELIABILITY_CHECKPOINTS=${{ env.DEPLOY_CHECKPOINTS }}:PREDICTIVE_PROVIDER_ID=${{ env.DEPLOY_PROVIDER_ID }}:PREDICTIVE_MODEL_VERSION=${{ env.DEPLOY_MODEL_VERSION }}" \
            "$AUTH_FLAG"

      - name: Get service URL
        id: service-url
        run: |
          SERVICE_URL="$(gcloud run services describe "${{ env.DEPLOY_SERVICE }}" \
            --project "${{ env.DEPLOY_PROJECT_ID }}" \
            --region "${{ env.DEPLOY_REGION }}" \
            --format='value(status.url)')"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Authenticate smoke test requests
        id: smoke-auth
        if: ${{ env.DEPLOY_ALLOW_UNAUTHENTICATED != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service-url.outputs.url }}
          id_token_include_email: true

      - name: Smoke test deployed service
        env:
          SMOKE_ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          set -euo pipefail

          SERVICE_URL="${{ steps.service-url.outputs.url }}"
          SMOKE_URL="$SERVICE_URL"
          gcloud run services describe "${{ env.DEPLOY_SERVICE }}" \
            --project "${{ env.DEPLOY_PROJECT_ID }}" \
            --region "${{ env.DEPLOY_REGION }}" \
            --format=json \
            | jq -e '.status.conditions[] | select(.type == "Ready" and .status == "True")'

          jq -n \
            --arg run_id "deploy-smoke-${{ github.run_id }}" \
            --arg provider_id "${{ env.DEPLOY_PROVIDER_ID }}" \
            --arg model_version "${{ env.DEPLOY_MODEL_VERSION }}" \
            '{
              observation_window_s: 30,
              run_id: $run_id,
              configured_windows: [30, 60, 180],
              samples: [
                {
                  elapsed_time: 30,
                  pid: "101",
                  name: "GradleDaemon",
                  heap_used: 128,
                  heap_cap: 512,
                  rss: 700,
                  gc_time: 50
                },
                {
                  elapsed_time: 60,
                  pid: "101",
                  name: "GradleDaemon",
                  heap_used: 160,
                  heap_cap: 512,
                  rss: 760,
                  gc_time: 80
                }
              ]
            }' > /tmp/predict-request.json

          if [ "${{ env.DEPLOY_ALLOW_UNAUTHENTICATED }}" != "true" ]; then
            SMOKE_URL="http://127.0.0.1:18080"
            if [ -z "$SMOKE_ID_TOKEN" ]; then
              echo "Smoke test ID token was not generated."
              exit 1
            fi
            gcloud run services proxy "${{ env.DEPLOY_SERVICE }}" \
              --project "${{ env.DEPLOY_PROJECT_ID }}" \
              --region "${{ env.DEPLOY_REGION }}" \
              --token "$SMOKE_ID_TOKEN" \
              --port 18080 >/tmp/cloud-run-proxy.log 2>&1 &
            PROXY_PID="$!"
            trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT

            for attempt in {1..30}; do
              if curl --fail --silent --show-error \
                -H "Content-Type: application/json" \
                --data @/tmp/predict-request.json \
                "$SMOKE_URL/predict" >/tmp/predict-response.json 2>/tmp/predict-curl.err; then
                break
              fi
              sleep 1
            done
            if [ ! -s /tmp/predict-response.json ]; then
              cat /tmp/cloud-run-proxy.log
              cat /tmp/predict-curl.err
              exit 1
            fi
          else
            curl --fail --silent --show-error "$SMOKE_URL/healthz" >/tmp/health-response.json
            jq -e '.status == "healthy"' /tmp/health-response.json
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data @/tmp/predict-request.json \
              "$SMOKE_URL/predict" >/tmp/predict-response.json
          fi

          jq -e \
            --arg provider_id "${{ env.DEPLOY_PROVIDER_ID }}" \
            --arg model_version "${{ env.DEPLOY_MODEL_VERSION }}" \
            '.checkpoint.status == "ready"
              and .checkpoint.observation_window_s == 30
              and .checkpoint.provider_id == $provider_id
              and .checkpoint.model_version == $model_version' \
            /tmp/predict-response.json
