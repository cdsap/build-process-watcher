name: Test Action Build

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'jest.config.js'
      - 'build.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'action.yaml'
      - 'monitor_with_backend.sh'
      - 'frontend/public/compare-shared.js'
      - '.github/workflows/test-action.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'jest.config.js'
      - 'build.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'action.yaml'
      - 'monitor_with_backend.sh'
      - 'frontend/public/compare-shared.js'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Action
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        echo "📦 Installing npm dependencies..."
        npm ci

    - name: Build TypeScript action
      run: |
        echo "🔨 Building TypeScript action..."
        npm run build

    - name: Verify build outputs
      run: |
        echo "✅ Verifying build outputs..."
        if [ ! -f "dist/index_with_backend.js" ]; then
          echo "❌ ERROR: dist/index_with_backend.js not found!"
          exit 1
        fi
        echo "✅ dist/index_with_backend.js exists"
        
        if [ ! -f "dist/cleanup.js" ]; then
          echo "❌ ERROR: dist/cleanup.js not found!"
          exit 1
        fi
        echo "✅ dist/cleanup.js exists"
        
        if [ ! -f "monitor_with_backend.sh" ]; then
          echo "❌ ERROR: monitor_with_backend.sh not found!"
          exit 1
        fi
        echo "✅ monitor_with_backend.sh exists"
        
        # Check if we can make it executable (the action will do this at runtime)
        chmod +x monitor_with_backend.sh
        if [ -x "monitor_with_backend.sh" ]; then
          echo "✅ monitor_with_backend.sh can be made executable"
        else
          echo "❌ ERROR: Cannot make monitor_with_backend.sh executable!"
          exit 1
        fi
        
        echo "✅ All required files present and valid"

    - name: Check action metadata
      run: |
        echo "📋 Validating action.yaml..."
        if [ ! -f "action.yaml" ]; then
          echo "❌ ERROR: action.yaml not found!"
          exit 1
        fi
        echo "✅ action.yaml found"

    - name: TypeScript type check
      run: |
        echo "🔍 Running TypeScript type check..."
        npx tsc --noEmit

    - name: Run unit tests
      run: |
        echo "🧪 Running unit tests..."
        npm test

    - name: Verify artifact naming uses job name
      run: |
        echo "🧪 Verifying artifact naming in cleanup..."
        if grep -q 'jobName\|GITHUB_JOB' src/cleanup.ts && grep -q 'artifactName' src/cleanup.ts; then
          if grep -q 'build_process_watcher-.*jobName\|build_process_watcher-.*GITHUB_JOB' src/cleanup.ts; then
            echo "✅ PASS: Cleanup uses job name (GITHUB_JOB) in artifact naming"
          else
            echo "✅ PASS: Cleanup references job name for artifacts"
          fi
        else
          echo "❌ FAIL: Cleanup should use GITHUB_JOB for artifact naming"
          exit 1
        fi

    - name: Verify GC is always enabled
      run: |
        echo "🧪 Verifying GC is always enabled"
        echo "===================================="
        # GC is no longer an input - always enabled
        if grep -q "collect_gc:" action.yaml; then
          echo "❌ FAIL: action.yaml should not have collect_gc input (GC is always enabled)"
          exit 1
        fi
        echo "✅ PASS: action.yaml does not have collect_gc input"
        if ! grep -q "GC_Time_S" monitor_with_backend.sh; then
          echo "❌ FAIL: Script should include GC_Time_S in log header"
          exit 1
        fi
        echo "✅ PASS: Script includes GC_Time_S in log header"
        if ! grep -q "COLLECT_GC: 'true'" src/index_with_backend.ts; then
          echo "❌ FAIL: TypeScript should always set COLLECT_GC to true"
          exit 1
        fi
        echo "✅ PASS: TypeScript always enables GC"
        echo "===================================="

    - name: Verify JIT and class-loading contract
      run: |
        grep -q "JIT_Compiled" monitor_with_backend.sh
        grep -q "Classes_Loaded" monitor_with_backend.sh
        grep -q "jstat_named_values -compiler" monitor_with_backend.sh
        grep -q "jstat_named_values -class" monitor_with_backend.sh
        grep -q "JITCompilationTimeMs" src/lib/report.ts
        grep -q "ClassLoadTimeMs" src/lib/report.ts

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: action-dist
        path: |
          dist/
          monitor_with_backend.sh
        retention-days: 7

    - name: Build summary
      run: |
        echo "✅ Action build completed successfully!"
        echo "📦 Built files:"
        ls -lh dist/
