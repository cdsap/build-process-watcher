name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
        type: choice
        options:
        - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: backend-deploy
        module-root: backend
        repository-cache: true

    - name: Run Backend Tests
      working-directory: ./backend
      run: |
        echo "🧪 Running Go backend tests..."
        make test-all
        echo "📊 Running tests with coverage..."
        make test-coverage
        echo "⚡ Running performance benchmarks..."
        make benchmark

    - name: Deploy to Cloud Run
      working-directory: ./backend
      env:
        SERVICE_NAME: build-process-watcher-backend
        REGION: us-central1
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        BIGQUERY_EXPORT_DATASET: ${{ secrets.BIGQUERY_EXPORT_DATASET }}
        BIGQUERY_EXPORT_TABLE: ${{ secrets.BIGQUERY_EXPORT_TABLE }}
        BIGQUERY_EXPORT_PROCESSES_TABLE: ${{ secrets.BIGQUERY_EXPORT_PROCESSES_TABLE }}
        PREDICTIVE_PROVIDER_ENABLED: ${{ secrets.PREDICTIVE_PROVIDER_ENABLED }}
        PREDICTIVE_PROVIDER_URL: ${{ secrets.PREDICTIVE_PROVIDER_URL }}
        PREDICTIVE_PROVIDER_AUTH_AUDIENCE: ${{ secrets.PREDICTIVE_PROVIDER_AUTH_AUDIENCE }}
        PREDICTIVE_PROVIDER_TIMEOUT_MS: ${{ secrets.PREDICTIVE_PROVIDER_TIMEOUT_MS }}
        PREDICTIVE_RELIABILITY_CHECKPOINTS: ${{ secrets.PREDICTIVE_RELIABILITY_CHECKPOINTS }}
      run: make deploy

    - name: Get service URL
      id: get-url
      run: |
        SERVICE_URL=$(gcloud run services describe build-process-watcher-backend \
          --region=us-central1 \
          --format="value(status.url)")
        echo "service-url=$SERVICE_URL" >> $GITHUB_OUTPUT

    - name: Smoke test predictive checkpoints
      env:
        SERVICE_URL: ${{ steps.get-url.outputs.service-url }}
        PREDICTIVE_PROVIDER_ENABLED: ${{ secrets.PREDICTIVE_PROVIDER_ENABLED }}
        PREDICTIVE_RELIABILITY_CHECKPOINTS: ${{ secrets.PREDICTIVE_RELIABILITY_CHECKPOINTS }}
      run: |
        set -euo pipefail

        if [ "$PREDICTIVE_PROVIDER_ENABLED" != "true" ]; then
          echo "Predictive provider is disabled; skipping predictive checkpoint smoke test."
          exit 0
        fi

        RUN_ID="deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        AUTH_JSON="$(curl --fail --silent --show-error -X POST "$SERVICE_URL/auth/run/$RUN_ID?predictive_reliability=true")"
        TOKEN="$(printf '%s' "$AUTH_JSON" | jq -r '.token')"
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "Auth response did not include a token."
          exit 1
        fi

        jq -n \
          --arg run_id "$RUN_ID" \
          --arg data $'00:00:30 | 101 | GradleDaemon | 128MB | 512MB | 700MB | 0.05s\n00:01:00 | 101 | GradleDaemon | 160MB | 512MB | 760MB | 0.08s\n00:03:00 | 101 | GradleDaemon | 220MB | 512MB | 850MB | 0.10s' \
          '{run_id: $run_id, data: $data}' > /tmp/ingest-request.json

        curl --fail --silent --show-error \
          -X POST "$SERVICE_URL/ingest" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          --data @/tmp/ingest-request.json \
          | jq -e '.status == "success"'

        CHECKPOINT_WINDOWS="${PREDICTIVE_RELIABILITY_CHECKPOINTS:-60,300,600,1200}"
        EXPECTED_CHECKPOINTS="$(printf '%s' "$CHECKPOINT_WINDOWS" | jq -R '
          split(",")
          | map(gsub("^\\s+|\\s+$"; ""))
          | map(select(length > 0))
          | map(tonumber? // empty)
          | map(select(. <= 180))
          | length
        ')"
        for attempt in $(seq 1 12); do
          curl --fail --silent --show-error "$SERVICE_URL/runs/$RUN_ID" > /tmp/smoke-run.json
          if jq -e --argjson expected "$EXPECTED_CHECKPOINTS" '
              (.samples | length) == 3
              and ((.prediction_checkpoints // []) | length) == $expected
              and all((.prediction_checkpoints // [])[]; .status == "ready")
            ' /tmp/smoke-run.json; then
            exit 0
          fi

          echo "Waiting for predictive checkpoints (${attempt}/12): $(jq -r '
            "samples=\(.samples | length), expected_checkpoints='"$EXPECTED_CHECKPOINTS"', checkpoints=\((.prediction_checkpoints // []) | length), statuses=\([(.prediction_checkpoints // [])[]?.status] | join(","))"
          ' /tmp/smoke-run.json)"
          sleep 5
        done

        echo "Predictive checkpoints did not become ready in time."
        jq -r '
          "samples=\(.samples | length), expected_checkpoints='"$EXPECTED_CHECKPOINTS"', checkpoints=\((.prediction_checkpoints // []) | length), statuses=\([(.prediction_checkpoints // [])[]?.status] | join(","))"
        ' /tmp/smoke-run.json
        exit 1

    - name: Output service URL
      run: |
        echo "🚀 Backend deployed successfully!"
        echo "📡 Service URL: ${{ steps.get-url.outputs.service-url }}"
