name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'
        type: choice
        options:
        - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: backend-deploy
        module-root: backend
        repository-cache: true

    - name: Run Backend Tests
      working-directory: ./backend
      run: |
        echo "🧪 Running Go backend tests..."
        make test-all
        echo "📊 Running tests with coverage..."
        make test-coverage
        echo "⚡ Running performance benchmarks..."
        make benchmark

    - name: Deploy to Cloud Run
      working-directory: ./backend
      env:
        SERVICE_NAME: build-process-watcher-backend
        REGION: us-central1
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        BIGQUERY_EXPORT_DATASET: ${{ secrets.BIGQUERY_EXPORT_DATASET }}
        BIGQUERY_EXPORT_TABLE: ${{ secrets.BIGQUERY_EXPORT_TABLE }}
        BIGQUERY_EXPORT_PROCESSES_TABLE: ${{ secrets.BIGQUERY_EXPORT_PROCESSES_TABLE }}
        PREDICTIVE_PROVIDER_ENABLED: ${{ secrets.PREDICTIVE_PROVIDER_ENABLED }}
        PREDICTIVE_PROVIDER_URL: ${{ secrets.PREDICTIVE_PROVIDER_URL }}
        PREDICTIVE_PROVIDER_AUTH_AUDIENCE: ${{ secrets.PREDICTIVE_PROVIDER_AUTH_AUDIENCE }}
        PREDICTIVE_PROVIDER_TIMEOUT_MS: ${{ secrets.PREDICTIVE_PROVIDER_TIMEOUT_MS }}
        PREDICTIVE_RELIABILITY_CHECKPOINTS: ${{ secrets.PREDICTIVE_RELIABILITY_CHECKPOINTS }}
      run: make deploy

    - name: Get service URL
      id: get-url
      run: |
        SERVICE_URL=$(gcloud run services describe build-process-watcher-backend \
          --region=us-central1 \
          --format="value(status.url)")
        echo "service-url=$SERVICE_URL" >> $GITHUB_OUTPUT


    - name: Output service URL
      run: |
        echo "🚀 Backend deployed successfully!"
        echo "📡 Service URL: ${{ steps.get-url.outputs.service-url }}"
