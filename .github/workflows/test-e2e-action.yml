name: E2E Action Test

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'action.yaml'
      - 'monitor_with_backend.sh'
      - '.github/workflows/test-e2e-action.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'action.yaml'
      - 'monitor_with_backend.sh'
      - '.github/workflows/test-e2e-action.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  test-local-mode:
    name: Test Action (Local Mode)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build the action
      run: |
        echo "🔨 Building action for testing..."
        npm ci
        npm run build

    - name: Test action in local mode
      uses: ./
      with:
        remote_monitoring: 'false'
        log_file: '${{ github.workspace }}/test_local.log'
        interval: '2'
        debug: 'true'

    - name: Simulate build workload
      run: |
        echo "🏗️  Simulating build workload..."
        sleep 10
        echo "✅ Build simulation completed"

    - name: Search for log files
      if: always()
      run: |
        echo "🔍 Searching for log files in common locations..."
        echo "Current directory: $(pwd)"
        echo "Workspace: ${{ github.workspace }}"
        find ${{ github.workspace }} -name "*.log" -type f 2>/dev/null || true
        find . -name "*.log" -type f -maxdepth 3 2>/dev/null || true

    - name: Verify local log file
      run: |
        echo "📋 Checking for log file..."
        LOG_FILE="${{ github.workspace }}/test_local.log"
        
        if [ -f "$LOG_FILE" ]; then
          echo "✅ Log file created successfully at: $LOG_FILE"
          echo "📄 Log file content:"
          head -20 "$LOG_FILE"
          
          # Check if log has expected structure
          if grep -q "Elapsed_Time" "$LOG_FILE"; then
            echo "✅ Log file has correct header"
          else
            echo "❌ Log file missing expected header"
            cat "$LOG_FILE"
            exit 1
          fi
        else
          echo "⚠️  Log file not found at expected location: $LOG_FILE"
          echo "📂 Checking alternative locations..."
          
          # Check if any log file was created
          if [ -f "test_local.log" ]; then
            echo "✅ Found log file in current directory"
            cat test_local.log
          elif [ -f "build_process_watcher.log" ]; then
            echo "✅ Found default log file"
            cat build_process_watcher.log
          else
            echo "❌ ERROR: No log files found!"
            echo "This might be expected if no Java processes were found to monitor."
            echo "Test will pass as the action executed without errors."
          fi
        fi

    # Note: Artifact upload is handled by the cleanup action post-step
    # The cleanup action will automatically upload build_process_watcher.log and other artifacts

  test-remote-mode-dry-run:
    name: Test Action (Remote Mode - Dry Run)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build the action
      run: |
        echo "🔨 Building action for testing..."
        npm ci
        npm run build

    - name: Test action in remote mode (without actual backend)
      uses: ./
      with:
        remote_monitoring: 'true'
        backend_url: 'https://test-backend.example.com'
        run_id: 'test-run-${{ github.run_id }}'
        log_file: '${{ github.workspace }}/test_remote.log'
        interval: '2'
        debug: 'true'
      continue-on-error: true  # Backend won't be reachable, but we test the setup

    - name: Simulate build workload
      run: |
        echo "🏗️  Simulating build workload..."
        sleep 10
        echo "✅ Build simulation completed"

    - name: Search for all log files
      if: always()
      run: |
        echo "🔍 Searching for all log files..."
        find ${{ github.workspace }} -name "*.log" -type f 2>/dev/null || true
        find . -name "*.log" -type f -maxdepth 3 2>/dev/null || true

    - name: Check that monitoring attempted to start
      run: |
        echo "🔍 Verifying monitoring process attempted to start..."
        
        # Check if log file was created
        if [ -f "${{ github.workspace }}/test_remote.log" ] || [ -f "test_remote.log" ]; then
          echo "✅ Log file created"
          cat "${{ github.workspace }}/test_remote.log" 2>/dev/null || cat "test_remote.log" 2>/dev/null || true
        else
          echo "⚠️  Main log file not created (might be expected if no Java processes found)"
        fi
        
        # Check if backend debug log was created
        if [ -f "${{ github.workspace }}/backend_debug.log" ]; then
          echo "✅ Backend debug log created at workspace root"
          echo "📄 Backend debug log preview:"
          head -30 "${{ github.workspace }}/backend_debug.log"
        elif [ -f "backend_debug.log" ]; then
          echo "✅ Backend debug log created in action directory"
          echo "📄 Backend debug log preview:"
          head -30 backend_debug.log
        else
          echo "⚠️  Backend debug log not created"
          echo "This might be expected in a dry run environment"
        fi
        
        echo "✅ Remote mode test completed (errors expected due to unreachable backend)"

    # Note: Artifact upload is handled by the cleanup action post-step
    # The cleanup action will automatically upload backend_debug.log and other artifacts

  test-monitoring-script:
    name: Test Monitoring Script
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test monitoring script syntax
      run: |
        echo "🔍 Checking bash script syntax..."
        bash -n monitor_with_backend.sh
        if [ $? -eq 0 ]; then
          echo "✅ Script syntax is valid"
        else
          echo "❌ Script has syntax errors!"
          exit 1
        fi

    - name: Test script permissions
      run: |
        echo "🔒 Checking script permissions..."
        if [ -x "monitor_with_backend.sh" ] || [ -f "monitor_with_backend.sh" ]; then
          echo "✅ Script file exists"
          chmod +x monitor_with_backend.sh
          echo "✅ Made script executable"
        else
          echo "❌ ERROR: Script file not found!"
          exit 1
        fi

    - name: Test script with minimal execution
      timeout-minutes: 1
      run: |
        echo "🧪 Testing script execution..."
        # Set required environment variables
        export BACKEND_URL=""
        export RUN_ID="test-run"
        export LOG_FILE="test.log"
        export DEBUG_MODE="false"
        export REMOTE_MONITORING="false"
        export GITHUB_ACTIONS="false"  # Prevent cleanup from trying to upload artifacts
        
        # Start script in background with timeout
        timeout 3 bash -c './monitor_with_backend.sh 2' &
        SCRIPT_PID=$!
        echo "Started script with PID: $SCRIPT_PID"
        
        # Wait a short time then kill it
        sleep 4
        
        # Kill the script and all its children
        pkill -P $SCRIPT_PID 2>/dev/null || true
        kill $SCRIPT_PID 2>/dev/null || true
        sleep 1
        kill -9 $SCRIPT_PID 2>/dev/null || true
        
        echo "✅ Script execution test completed"
        
    - name: Verify GC is always enabled in script
      timeout-minutes: 1
      run: |
        echo "🧪 Verifying GC is always enabled..."
        # GC is always enabled - script should always include GC_Time_S in header
        if grep -q "GC_Time_S" monitor_with_backend.sh; then
          echo "✅ Script includes GC_Time_S in log header (GC always enabled)"
        else
          echo "❌ ERROR: Script should include GC_Time_S in header!"
          exit 1
        fi
        echo "✅ GC always enabled verification completed"

    - name: Verify log file was created
      run: |
        echo "📋 Checking for log file..."
        if [ -f "test.log" ]; then
          echo "✅ Script executed and created log file"
          echo "📄 Log file content:"
          cat test.log
          
          # Verify log has expected structure
          if grep -q "Elapsed_Time" test.log; then
            echo "✅ Log file has correct header"
          else
            echo "⚠️  Log file structure unexpected (might be empty if no processes found)"
          fi
        else
          echo "⚠️  Log file not created"
          echo "This is acceptable if no Java processes were running during the test"
        fi
        
        echo "✅ Script test passed"

    - name: Verify process_info file and unified loop
      run: |
        echo "🧪 Verifying process_info and unified loop..."
        # Process info file should be initialized (same dir as log)
        if grep -q "PROCESS_INFO_FILE" monitor_with_backend.sh; then
          echo "✅ PASS: Script initializes PROCESS_INFO_FILE"
        else
          echo "❌ FAIL: Script does not define PROCESS_INFO_FILE"
          exit 1
        fi
        # VM flags should be written to process_info (not just sent to backend)
        if grep -q 'printf.*PROCESS_INFO_FILE' monitor_with_backend.sh; then
          echo "✅ PASS: Script writes VM flags to process_info file"
        else
          echo "❌ FAIL: Script does not write VM flags to process_info"
          exit 1
        fi
        # Single unified loop (no separate local-only loop)
        if ! grep -q 'if \[ "\$BACKEND_AVAILABLE" = "false" \].*while true' monitor_with_backend.sh; then
          echo "✅ PASS: No separate local-only while loop"
        fi
        # Backend send should be conditional
        if grep -q '\[ "\$BACKEND_AVAILABLE" = "true" \]' monitor_with_backend.sh; then
          echo "✅ PASS: Script uses BACKEND_AVAILABLE for conditional logic"
        else
          echo "❌ FAIL: Script should conditionally send based on BACKEND_AVAILABLE"
          exit 1
        fi
        echo "✅ process_info and unified loop verification passed"

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: script-test-logs
        path: |
          test.log
          backend_debug.log
        retention-days: 7

  test-collect-gc:
    name: Verify GC Always Enabled
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify script always uses GC header
      run: |
        echo "🧪 Verifying GC is always enabled (no collect_gc input)"
        # Script should always write GC_Time_S header - no conditional
        if ! grep -q "GC_Time_S" monitor_with_backend.sh; then
          echo "❌ FAIL: Script should include GC_Time_S in log header"
          exit 1
        fi
        echo "✅ PASS: Script includes GC_Time_S in header"
        # action.yaml should NOT have collect_gc input
        if grep -q "collect_gc:" action.yaml; then
          echo "❌ FAIL: action.yaml should not have collect_gc (GC is always enabled)"
          exit 1
        fi
        echo "✅ PASS: action.yaml correctly has no collect_gc input"
        echo "✅ GC always enabled verification completed"

  test-composite-actions:
    name: Test Composite Actions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate composite action metadata
      run: |
        echo "📋 Validating composite action files..."
        
        # Check composite action
        if [ -f "composite/action.yml" ]; then
          echo "✅ composite/action.yml exists"
          cat composite/action.yml | grep -q "runs:" && echo "✅ Has runs section"
        else
          echo "❌ composite/action.yml missing"
          exit 1
        fi
        
        # Check start action
        if [ -f "start/action.yml" ]; then
          echo "✅ start/action.yml exists"
        else
          echo "❌ start/action.yml missing"
          exit 1
        fi
        
        # Check cleanup action
        if [ -f "cleanup/action.yml" ]; then
          echo "✅ cleanup/action.yml exists"
        else
          echo "❌ cleanup/action.yml missing"
          exit 1
        fi

  summary:
    name: Test Summary
    needs: [test-local-mode, test-remote-mode-dry-run, test-monitoring-script, test-collect-gc, test-composite-actions]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "📊 E2E Test Summary:"
        echo "  ✅ Local mode test: ${{ needs.test-local-mode.result }}"
        echo "  ✅ Remote mode test: ${{ needs.test-remote-mode-dry-run.result }}"
        echo "  ✅ Script test: ${{ needs.test-monitoring-script.result }}"
        echo "  ✅ GC always enabled test: ${{ needs.test-collect-gc.result }}"
        echo "  ✅ Composite actions: ${{ needs.test-composite-actions.result }}"
        
        if [ "${{ needs.test-local-mode.result }}" != "success" ] || \
           [ "${{ needs.test-monitoring-script.result }}" != "success" ] || \
           [ "${{ needs.test-collect-gc.result }}" != "success" ] || \
           [ "${{ needs.test-composite-actions.result }}" != "success" ]; then
          echo "❌ Some tests failed!"
          exit 1
        fi
        
        echo "✅ All critical tests passed!"

