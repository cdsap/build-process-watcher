name: Compare BPW collectors

on:
  workflow_dispatch:
    inputs:
      workload_repository:
        description: 'Public repository to build (owner/name)'
        required: true
        type: string
      workload_ref:
        description: 'Workload branch, tag, or commit (resolved once for both jobs)'
        required: true
        type: string
      build_command:
        description: 'Identical build command for both collectors'
        default: './gradlew assemble --no-daemon'
        required: true
        type: string
      java_version:
        description: 'JDK used by both builds'
        default: '21'
        type: string
      remote_monitoring:
        description: 'Upload through the existing BPW backend'
        default: false
        type: boolean
      export_to_bigquery:
        description: 'Request BigQuery export on remote run completion'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      workload_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workload_repository }}
          ref: ${{ inputs.workload_ref }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compare:
    needs: resolve
    name: Build with ${{ matrix.collector }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collector: [shell, daemonitor]
    env:
      DAEMONITOR_VERSION: '1.3.3'
    steps:
      - uses: actions/checkout@v4
        with:
          path: bpw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workload_repository }}
          ref: ${{ needs.resolve.outputs.workload_commit }}
          path: workload
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - name: Build BPW
        working-directory: bpw
        run: |
          npm ci
          npm run build
      - name: Install Daemonitor CLI from Homebrew
        id: daemonitor
        if: matrix.collector == 'daemonitor'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cdsap/tap/daemonitor-cli
          installed=$(brew list --versions cdsap/tap/daemonitor-cli)
          if [[ "$installed" != "daemonitor-cli $DAEMONITOR_VERSION" ]]; then
            echo "Expected Daemonitor $DAEMONITOR_VERSION, installed: $installed" >&2
            exit 1
          fi
          bin_dir="$(brew --prefix cdsap/tap/daemonitor-cli)/bin"
          test -x "$bin_dir/daemonitor-cli"
          test -x "$bin_dir/daemonitor-cored"
          echo "bin_dir=$bin_dir" >> "$GITHUB_OUTPUT"
      - name: Start collector
        uses: ./bpw
        env:
          BACKEND_URL: ${{ vars.BPW_BACKEND_URL }}
          FRONTEND_URL: ${{ vars.BPW_FRONTEND_URL }}
        with:
          collector: ${{ matrix.collector }}
          daemonitor_bin_dir: ${{ steps.daemonitor.outputs.bin_dir }}
          run_id: comparison-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.collector }}
          interval: '5'
          remote_monitoring: ${{ inputs.remote_monitoring }}
          export_to_bigquery: ${{ inputs.export_to_bigquery }}
      - name: Run identical workload
        working-directory: workload
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -e -o pipefail -c "$BUILD_COMMAND"
      # The Action's registered post step stops, flushes, finishes, and uploads artifacts.
